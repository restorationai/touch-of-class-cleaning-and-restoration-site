# Railway config-as-code for the Geo-grid bi-weekly CRON service ONLY.
# Set this service's "Config-as-code file path" to this file so it does NOT inherit
# the root railway.toml (FastAPI web) or the other service configs.
#
# BI-WEEKLY local-map-rankings scan: for each configured client, scans every
# (keyword x city) over an N x N grid via DataForSEO Google Maps, writes a NEW
# marketing_geogrid_scans row + its marketing_geogrid_points, renders a static
# PNG, and uploads it to the client's R2 bucket (image_url). Scans are never
# overwritten -> the accumulating history powers the dashboard's Compare view.
[build]
builder = "NIXPACKS"

[deploy]
# No flags = every client with clients/{slug}/geogrid-keywords.txt + geogrid-cities.json.
startCommand = "/opt/venv/bin/python scripts/geogrid_cron.py"
# 08:00 UTC on the 1st and 15th (~midnight PT) -> ~every 2 weeks. Cron has no native
# bi-weekly; 1st & 15th is the standard approximation and gives "Week 1 vs Week 3".
cronSchedule = "0 8 1,15 * *"
# One-shot job: do NOT restart on exit, NO healthcheck.
restartPolicyType = "NEVER"

# Required service variables (set in the Railway dashboard for THIS service):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  — write scans/points (service role bypasses RLS)
#   CLOUDFLARE_ACCOUNT_ID                    — R2 REST upload target
#   CLOUDFLARE_R2_API_TOKEN                  — R2:Edit (falls back to CLOUDFLARE_API_TOKEN)
#   DATAFORSEO_USERNAME / DATAFORSEO_PASSWORD — Maps SERP per point
# NOTE: the scanner also reads DataForSEO creds from ~/.claude.json if present;
# in the Railway container set the two env vars above instead. Cost ~ $0.20-0.35
# per (keyword x city) at 13x13, zoom 12.
