name: Rank AI Client Ops Sync

# Client-ops feedback loop (phase 1): daily watch on the two app-facing
# Supabase tables — client_intake_items (answered questions) and
# marketing_action_plan (done/dismissed/approved rows). Mechanical handlers
# (license numbers -> plan-input brand truth, gating yes/no -> ops-journal +
# unblock plan rows, customer-list checklists -> review-campaign staging rows)
# run automatically; everything else lands in one digest email to
# contact@restorationai.io. State cursor + journals + digests are committed
# back to the repo. See scripts/client_ops_sync.py docstring.
on:
  schedule:
    - cron: '0 14 * * *'   # daily, 7 am PDT / 6 am PST — before the workday
  workflow_dispatch:         # manual trigger for testing
    inputs:
      dry_run:
        description: 'Dry run (classify + print, write nothing, no email)'
        type: boolean
        default: false
      since:
        description: 'Optional: ISO cursor override (e.g. 2026-07-01)'
        required: false

# Connect-triggered dispatches (google-oauth-exchange / connect-link-exchange
# / stripe-webhook) can stack up; one pass at a time, extras queue.
concurrency:
  group: client-ops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # auto site-builds (seed->scaffold->render) blow the old 20m budget — HomeLyft's build got cancelled mid-render 2026-08-01

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      - name: Run client ops sync
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONNECT_LINK_SIGNING_SECRET: ${{ secrets.CONNECT_LINK_SIGNING_SECRET }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
          # auto site-builds push the per-client repo (2026-08-01: HomeLyft's
          # scaffold failed here for lack of it); call-tracking heal needs Twilio
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          TWILIO_MASTER_ACCOUNT_SID: ${{ secrets.TWILIO_MASTER_ACCOUNT_SID }}
          TWILIO_MASTER_AUTH_TOKEN:  ${{ secrets.TWILIO_MASTER_AUTH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID:    ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Agency-mailbox read for the setup ledger's delegate-access
          # verification (scripts/domain_access_email.py, 2026-08-05): the
          # SAME refresh token email_intake.py uses for contact@ /setup@.
          # Without it every "access confirmed" claim stays UNVERIFIED
          # rather than silently trusted.
          GMAIL_TOKEN_JSON:          ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_JSON_GETREST:  ${{ secrets.GMAIL_TOKEN_JSON_GETREST }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/client_ops_sync.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--send' }} \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}

      - name: Location launch checklists -> Monica asks
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Second-office program (2026-08-13): every company_locations row
          # not yet 'live' carries a launch checklist (app LocationsPanel
          # writes it). Seeds ONE marketing_action_plan client ask per
          # location for the earliest undone step that needs the CLIENT
          # (DBA photo -> address -> Google verification) and retires it the
          # sweep after the step completes. Monica picks the asks up
          # natively. Also the STATE REGISTRY WATCHER: locations with a dba
          # filing in flight get their state's public business registry
          # checked (Iowa first); on approval the dba step flips itself with
          # the registered names + file number, the client gets the good
          # news via Monica, and a naming decision card is seeded if no
          # city-suffixed trade name was approved. Advisory — never fails
          # the ops run.
          python3 scripts/location_checklist_sync.py || true

      - name: LSA auto-detection (queue #5, 2026-07-31)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_MCC_CUSTOMER_ID: '2018844125'
          NARESTCO_ADS_TOKEN:         ${{ secrets.NARESTCO_ADS_TOKEN }}
        run: |
          # Finds Local Services campaigns via each client's own Google grant
          # and stamps integration_settings.lsa so the ledger's "LSA setup not
          # started" row flips itself. Advisory — never fails the ops run.
          # Token-file restore enables the MCC-walk mode in CI too.
          if [ -n "$NARESTCO_ADS_TOKEN" ]; then
            printf '%s' "$NARESTCO_ADS_TOKEN" > clients/narestco/.ads-token.json
          fi
          python3 scripts/lsa_detect.py || true
          # Read the manager links BACK and write the result to
          # connection_metadata (2026-08-05). This is what feeds
          # client_concierge._stored_link_facts: the Railway ops-worker that
          # composes Monica's messages has NO Google Ads credentials, so the
          # live check there is always unavailable and the guard can only
          # retire an "accept our invite" ask from what this step wrote down.
          # Unrun for a week = Monica asking clients for access we already
          # hold (Jaziel/RestorationXpress, 2026-08-05 13:13).
          # AUTO-ACCEPT our own MCC invites as the client (Santino
          # 2026-09-20: ACS + FF Solutions sat PENDING because the accepter
          # was only ever run by hand — invites and the audit were
          # scheduled, acceptance never was). Runs BEFORE the audit so the
          # audit reconciles the fresh ACTIVE states same-night.
          python3 scripts/ads_link_accept.py --apply || true
          python3 scripts/lsa_link_audit.py --apply || true
          rm -f clients/narestco/.ads-token.json
          # BRANDED SHORT LINKS (n8n Phase 3, 2026-09-21): every live-site
          # client gets {domain}/s/* -> app resolver + the
          # branded_link_host stamp the master sender trusts. Idempotent;
          # picks up new cutovers the night they launch.
          python3 scripts/branded_links.py provision || true
          # SERVICE RIPPLE (Heritage 2026-09-22): services confirmed into
          # the truth table AFTER the site was built grow the site
          # automatically (plan + stubs here, render sweep writes +
          # deploys). Cap 5 sites/night; unmappable services file one
          # [DEV] note for a custom page.
          python3 scripts/service_ripple.py || true

      - name: Re-harvest new GBP photos (real-photo-first imagery, daily)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --gbp-only: the daily pass watches the one source that actually
          # changes day to day (the client uploading a job photo to their own
          # listing). The website re-crawl is weekly — a franchise page does not
          # gain new vans overnight. Both halves are incremental, so a day with
          # no new photos costs one storage list per client and no vision spend.
          python3 scripts/photo_harvest.py run --all --gbp-only || true

      - name: Backlink targets (seed new clients + live-link check)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/backlinks.py seed || true
          # discover v2 (2026-09-27): direct RIA-directory lookup, no Google SERP
          python3 scripts/backlinks.py discover || true
          python3 scripts/backlinks.py check || true

      - name: Citations -> site schema sameAs reconciliation
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # sync-deploy pushes the per-client repo for sites live on main
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          # 2026-09-18 first-outing fix: auto-apply + parity write to GBP —
          # without the OAuth pair every Google write silently skipped
          # ("no token/place") while the run stayed green.
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Parity placeId resolution (2026-09-18 wipe postmortem): every
          # serviceArea place is geocoded to a placeId before writing.
          GEOCODING_API_KEY:         ${{ secrets.GEOCODING_API_KEY }}
          # Site-photo parity lane write gate (unset = report mode).
          GBP_SITE_PHOTOS_WRITE:     ${{ vars.GBP_SITE_PHOTOS_WRITE }}
          GBP_SITE_PHOTOS_WEEKLY_CAP: ${{ vars.GBP_SITE_PHOTOS_WEEKLY_CAP }}
          # The watchdog's alert SMS rides the concierge ops-ping path.
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          CONCIERGE_ALLOWLIST:       ${{ secrets.CONCIERGE_ALLOWLIST }}
        run: |
          # Declares each client's live directory listings (nap_audit source
          # of truth) as schema.org sameAs URLs in brand.ts. Citations trickle
          # in for weeks after launch — this keeps the JSON-LD in step.
          # Live-on-main sites commit + sync-deploy themselves; preview-only
          # edits ride the commit step below. Idempotent, quiet when in sync.
          # Launch-path rehydration guard (2026-09-18, Dry Bros): domains
          # recorded in the app flow out to the repo record + site tokens
          # nightly, so Refresh Readiness never says "no real domain" about
          # a domain we hold.
          python3 scripts/domain_hydrate.py || true
          python3 scripts/citations_sync.py || true
          # Live GBP rating/review-count onto every site NIGHTLY (ACS
          # 2026-09-19: the strip hid 362 five-star reviews because this
          # only rode Mon/Thu weekly-maintenance; review counts move daily
          # and a fresh build could preview ratings-less for 4 days).
          python3 scripts/sync_brand_reviews.py --all || true
          # AI answers + awards (Santino 2026-09-27, Restoration Masters
          # teardown): llms.txt "Who is the best X in Y?" Q&A with live
          # rating/review proof, and any plan-input awards pushed into
          # brand.ts / schema award / trust strip / home meta. Runs after
          # review sync so answers carry today's counts. Idempotent.
          python3 scripts/ai_answers.py --all || true
          # Rename A2 (2026-09-16): the sweep behind Monica's DBA
          # vision-verify — puts "[legal] doing business as [DBA]" in the
          # footer + the DBA as the schema.org business name, so BL's
          # pre-submission checks and Google's GBP rename review find the
          # new name corroborated on the site. Stamps
          # rename_intent.site_synced_at; quiet when nothing is pending.
          python3 scripts/rename_site_sync.py || true
          # 2026-09-27: surface the Mini's Problems/Flags as ops notes
          python3 scripts/mini_report_watch.py || true
          # C11 (2026-09-16): agency toll-free verification watch. On
          # TWILIO_APPROVED it sets ESTIMATE_SMS_* on every rankai-* Pages
          # project (idempotent, self-heals new scaffolds), unlocking office
          # SMS for clients whose own toll-free isn't approved yet.
          python3 scripts/agency_tf_watch.py || true
          # E18 (2026-09-16): GA4 auto-wiring — key events (click_to_call,
          # generate_lead) + Google Ads links for every client with a GA4
          # id. Idempotent; new clients get wired on their first sweep.
          python3 scripts/ga4_wire.py || true
          # A2 (2026-09-17, approved after the RX test): GBP optimizer
          # auto-apply — safe classes only (service ADDs, junk REMOVEs
          # surviving the removal law, descriptions), one batched Google
          # call per client. Categories/names/pages stay human.
          python3 scripts/gbp_auto_apply.py --all --apply || true
          # PARITY ENGINE P1-P3 (2026-09-17): ledger + service loop (pages
          # queued for real GBP-only services, ADDs staged for site-only
          # services) + location loop (closest-20 service areas maintained
          # on GBP, home county pinned, fill-to-20 from the Census
          # gazetteer). Site-side city builds stay gated (--apply-site).
          python3 scripts/gbp_parity.py --all --apply --apply-site --max-new-cities 1 || true
          # SITE-PHOTO PARITY LANE (2026-09-28): per client (one process +
          # timeout each, LAW 09-19): refresh the site-assets mirror the app's
          # GBP Profile Planner drafts from, then add ONE website image per
          # client per rolling week (GBP_SITE_PHOTOS_WEEKLY_CAP, default 1):
          # only the hero + per-service images (real client photos first),
          # until they are exhausted; never sets/changes a cover, never a
          # logo. Every client with a verified GBP whose real domain serves
          # our build (owner-approved fleet-wide 2026-09-28); ledger ops_kv
          # gbp-site-media/{cid} dedupes. Writes need repo variable
          # GBP_SITE_PHOTOS_WRITE=1 (--apply alone never writes).
          for s in $(python3 scripts/gbp_site_media.py list-due | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            timeout 240 python3 scripts/gbp_site_media.py run --slug "$s" --apply || echo "gbp_site_media $s failed (non-fatal)"
          done
          # GBP PROFILE PLANNER TICK (2026-09-28): per applied plan, refresh
          # verification status (records verified_at, pushes queued photos on
          # VERIFIED) and, 3 days after Google verifies, swap the primary phone
          # to the DNI GBP tracking number (real number -> additional). The
          # swap only writes when the gbp-planner function secret
          # GBP_PLANNER_PHONE_SWAP=1 is set; otherwise it is reported as due.
          for c in $(python3 scripts/gbp_site_media.py list-planner | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            timeout 180 python3 scripts/gbp_site_media.py planner-tick --company-id "$c" || echo "planner-tick $c failed (non-fatal)"
          done
          # D1 PIPELINE WATCHDOG (2026-09-17): workflows + engine
          # heartbeats + per-client coverage assertions + content SLA.
          # Every silent failure class from the RX postmortem alerts
          # into Ops Attention within a day.
          python3 scripts/pipeline_watchdog.py || true
          # OPS NOTE AUTO-EXPIRE (2026-09-29, backlog hit 2,489 open notes):
          # per-tag TTLs + newest-per-client supersede for MACHINE notes only
          # (analyzer, preview pipeline, stage, dev handbacks, client-email
          # intake, Monica acks). Human/Monica notes are never touched. Rules
          # in the script docstring.
          python3 scripts/ops_note_expire.py || true

      - name: Mini heartbeat mirror (superadmin dot, 2026-09-14)
        # The Mac Mini heartbeats + daily-reports by git commit; this step
        # mirrors freshness into ops_kv so the app's superadmin status dot
        # (build-stages edge fn payload) can render it. Green < 26h,
        # amber < 50h, red beyond — computed app-side from last_beat.
        run: |
          python3 - <<'PYEOF' || echo "mini mirror failed (non-fatal)"
          import json, re, subprocess, pathlib
          from datetime import datetime, timezone
          import os, requests
          hb = pathlib.Path("clients/_ops/mini-heartbeat.md")
          last_beat = None
          if hb.exists():
              lines = [l for l in hb.read_text().splitlines() if l.strip()]
              if lines:
                  m = re.match(r"(\S+)", lines[-1])
                  last_beat = m.group(1) if m else None
          reports = sorted(pathlib.Path("clients/_ops/mini-reports").glob("DAILY-*.md"))
          daily = None
          if reports:
              rp = reports[-1]
              body = rp.read_text()[:2000]
              daily = {"file": rp.name, "body": body}
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          requests.post(os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/ops_kv?on_conflict=k",
              headers={"apikey": key, "Authorization": f"Bearer {key}",
                       "Content-Type": "application/json",
                       "Prefer": "resolution=merge-duplicates"},
              json={"k": "mini-status", "v": {"last_beat": last_beat,
                    "daily": daily,
                    "mirrored_at": datetime.now(timezone.utc).isoformat()}},
              timeout=30)
          print(f"mini-status mirrored: last_beat={last_beat}, daily={(daily or {}).get('file')}")
          PYEOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Game plan dispatch + completion sweep (4b, 2026-09-13)
        # AUTO game-plan steps -> the nightly dev agent's [DEV] inbox;
        # resolved tasks flip their Action Plan rows to done. Zero-human loop:
        # analyzer (Sun) writes the plan -> this dispatches -> dev agent
        # (2:07am + 1:07pm PT) executes -> sweep marks done from evidence.
        run: |
          python3 scripts/gameplan_dispatch.py || echo "gameplan dispatch failed (non-fatal)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Cutover harvest (301 maps staged before any domain cutover)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME:  ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_AGENCY_TOKEN:     ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          # Clients whose real domain still serves their OLD site (probe:
          # /llms.txt vs the repo's own sites/{slug}/public/llms.txt) get the
          # old site's URL inventory harvested and a 301 map merged into
          # sites/{slug}/public/_redirects while the old site is still alive
          # — TRG/Crew had these hand-built; everyone else was going to lose
          # their old rankings/backlinks at cutover. Redirects on a preview
          # site are harmless and ride the next normal deploy (no sync-deploy
          # here). Freshness-gated (>30d) so the paid DataForSEO backlinks
          # call runs at most ~monthly per client; cap 3 clients/run.
          # --no-commit: files ride the commit step below (a mid-job commit
          # would be stranded unpushed when that step finds nothing new).
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
          fi
          python3 scripts/cutover_harvest.py check --all || true
          python3 scripts/cutover_harvest.py auto --limit 3 --no-commit || true
          rm -f .gsc-agency-token.json

      - name: Case-study intake (client-emailed job stories -> site pages)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:         ${{ secrets.GOOGLE_AI_API_KEY }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Clients email case-study write-ups to contact@restorationai.io
          # (Crew's ask, 2026-08-14). email_inbox_sync files them as
          # [CLIENT EMAIL] notes; this step classifies the unprocessed ones,
          # renders real submissions through the content engine's case-study
          # conventions (claims_lint errors BLOCK the page), publishes to the
          # branch each site lives on, work-logs every study, and files one
          # [FOR MONICA] note with the live links. Idempotent via ops_kv
          # processed-ids. Commits + sync-deploys its own pages. Advisory —
          # never fails the ops run.
          python3 scripts/case_study_intake.py ingest --all --apply || true

      - name: Refresh Search Console data (app Reports tab)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:          ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/gsc_sync.py --all || true
            rm -f .gsc-agency-token.json
          else
            echo "GSC_AGENCY_TOKEN secret not set — Reports tab keeps last-synced data."
          fi

      - name: Compile monthly summaries (app Monthly Summary tab)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_AGENCY_TOKEN_JSON:   ${{ secrets.GMAIL_AGENCY_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # Rolls every source of client-visible work (work log, GBP changes,
          # reviews, ads journals, citations, content, site git history) into
          # one monthly_summaries row per client, which the app renders as
          # Marketing -> Monthly Summary. Runs last so today's earlier steps
          # (citations sync, GBP harvest) are already in the ledger.
          # Stale-ask audit FIRST (Santino 2026-08-31: Michael/Rob/Josiah all
          # got asked for things we already held) — retire satisfied asks
          # before any downstream step or Monica slot can work them.
          python3 scripts/ask_staleness_audit.py || true
          # Favicons follow logos automatically (Air Care 2026-08-31)
          python3 scripts/favicon_sync.py || true
          # Gmail watcher (Fran Carlo case 2026-09-01): unanswered client
          # emails to contact@ become ops notes so Monica's loop sees them.
          # Skips cleanly until the GMAIL_AGENCY_TOKEN_JSON secret exists.
          if [ -n "$GMAIL_AGENCY_TOKEN_JSON" ]; then
            python3 scripts/gmail_watch.py || true
          else
            echo "(gmail-watch: no token secret yet — skipped)"
          fi
          python3 scripts/monthly_summary.py compile --all || true
          # Monthly Report card (marketing_work_reports): calendar-month
          # anchored since 2026-08-30 — refresh the running month daily so
          # the pinned card stays current, same cadence as the summary.
          python3 scripts/work_report.py --all --publish \
            --month "$(date -u +%Y-%m)" || true
          # First days of a month: also refinalize the month that just closed,
          # so late-arriving rows (e.g. last night's work) make the final cut.
          if [ "$(date -u +%-d)" -le 3 ]; then
            python3 scripts/monthly_summary.py compile --all \
              --month "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)" || true
            python3 scripts/work_report.py --all --publish \
              --month "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)" || true
          fi

      - name: Stripe payment-record reconciliation
        # Nightly self-heal: Stripe's paid invoices vs our billing_invoices.
        # The webhook race dropped records for 11 clients before 2026-09-03
        # (payment gate wrongly blocked their site builds); the first sweep
        # found 17 MORE missing invoices. Non-fatal: a Stripe hiccup must
        # not take down the ops pass.
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/stripe_reconcile.py || echo "stripe-reconcile failed (non-fatal)"

      - name: Citation Builder live-sync
        # Every newly LIVE BrightLocal citation lands in the activity feed +
        # the app's Business Listings card (record_listing). Idempotent.
        env:
          BRIGHTLOCAL_API_KEY:       ${{ secrets.BRIGHTLOCAL_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/brightlocal.py sync || echo "brightlocal sync failed (non-fatal)"

      - name: Toll-free auto-registration watch
        # Rank AI plan actives: submit Twilio TFV the moment a client is
        # ready; file the Monica EIN ask (once/30d) for those missing it.
        # EIN capture from client texts lives in client_concierge; the watch
        # also reads EINs off hub-uploaded documents (ANTHROPIC key).
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          # thread-scan EIN capture reads client GHL conversations
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
        run: |
          python3 scripts/tollfree_autoreg.py watch --apply || echo "tollfree watch failed (non-fatal)"

      - name: Commit refreshed client data
        run: |
          # sites/ too: the auto-build path (setup_ledger.ensure_auto_site_build)
          # scaffolds + renders sites/{slug} in this job — committing only
          # clients/ threw the rendered site away and CI re-rendered it daily
          # (Reign 2026-08-03, second-order cost: the whole render bill again).
          git add clients/ sites/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: client ops sync $(date +%Y-%m-%d) [automated]"
            # rebase-retry with merge fallback (2026-09-19: a rebase conflict
            # with a same-day session commit failed the whole nightly)
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; git pull --no-rebase --no-edit -X ours origin main || true; }
              git push origin main && break
              sleep $((RANDOM % 15 + 5))
            done
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: Client Ops Sync run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Cron heartbeat (pg_cron pulse + latest-run status)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/cron_heartbeat.py || echo "heartbeat errored (non-fatal)"

      - name: Backlink + DR snapshots (self-gating monthly)
        if: always()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
          AHREFS_API_KEY:             ${{ secrets.AHREFS_API_KEY }}
        run: python3 scripts/backlink_tracker.py || true

      - name: Email intake + Monica email replies
        if: always()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_JSON:           ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_JSON_GETREST:   ${{ secrets.GMAIL_TOKEN_JSON_GETREST }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GHL_API_KEY:                ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:            ${{ secrets.GHL_LOCATION_ID }}
        run: python3 scripts/email_intake.py poll --send
