name: Rank AI Client Ops Sync

# Client-ops feedback loop (phase 1): daily watch on the two app-facing
# Supabase tables — client_intake_items (answered questions) and
# marketing_action_plan (done/dismissed/approved rows). Mechanical handlers
# (license numbers -> plan-input brand truth, gating yes/no -> ops-journal +
# unblock plan rows, customer-list checklists -> review-campaign staging rows)
# run automatically; everything else lands in one digest email to
# contact@restorationai.io. State cursor + journals + digests are committed
# back to the repo. See scripts/client_ops_sync.py docstring.
on:
  schedule:
    - cron: '0 14 * * *'   # daily, 7 am PDT / 6 am PST — before the workday
  workflow_dispatch:         # manual trigger for testing
    inputs:
      dry_run:
        description: 'Dry run (classify + print, write nothing, no email)'
        type: boolean
        default: false
      since:
        description: 'Optional: ISO cursor override (e.g. 2026-07-01)'
        required: false

# Connect-triggered dispatches (google-oauth-exchange / connect-link-exchange
# / stripe-webhook) can stack up; one pass at a time, extras queue.
concurrency:
  group: client-ops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # auto site-builds (seed->scaffold->render) blow the old 20m budget — HomeLyft's build got cancelled mid-render 2026-08-01

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      - name: Run client ops sync
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONNECT_LINK_SIGNING_SECRET: ${{ secrets.CONNECT_LINK_SIGNING_SECRET }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
          # auto site-builds push the per-client repo (2026-08-01: HomeLyft's
          # scaffold failed here for lack of it); call-tracking heal needs Twilio
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          TWILIO_MASTER_ACCOUNT_SID: ${{ secrets.TWILIO_MASTER_ACCOUNT_SID }}
          TWILIO_MASTER_AUTH_TOKEN:  ${{ secrets.TWILIO_MASTER_AUTH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID:    ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Agency-mailbox read for the setup ledger's delegate-access
          # verification (scripts/domain_access_email.py, 2026-08-05): the
          # SAME refresh token email_intake.py uses for contact@ /setup@.
          # Without it every "access confirmed" claim stays UNVERIFIED
          # rather than silently trusted.
          GMAIL_TOKEN_JSON:          ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_JSON_GETREST:  ${{ secrets.GMAIL_TOKEN_JSON_GETREST }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/client_ops_sync.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--send' }} \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}

      - name: Location launch checklists -> Monica asks
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Second-office program (2026-08-13): every company_locations row
          # not yet 'live' carries a launch checklist (app LocationsPanel
          # writes it). Seeds ONE marketing_action_plan client ask per
          # location for the earliest undone step that needs the CLIENT
          # (DBA photo -> address -> Google verification) and retires it the
          # sweep after the step completes. Monica picks the asks up
          # natively. Also the STATE REGISTRY WATCHER: locations with a dba
          # filing in flight get their state's public business registry
          # checked (Iowa first); on approval the dba step flips itself with
          # the registered names + file number, the client gets the good
          # news via Monica, and a naming decision card is seeded if no
          # city-suffixed trade name was approved. Advisory — never fails
          # the ops run.
          python3 scripts/location_checklist_sync.py || true

      - name: LSA auto-detection (queue #5, 2026-07-31)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_MCC_CUSTOMER_ID: '2018844125'
          NARESTCO_ADS_TOKEN:         ${{ secrets.NARESTCO_ADS_TOKEN }}
        run: |
          # Finds Local Services campaigns via each client's own Google grant
          # and stamps integration_settings.lsa so the ledger's "LSA setup not
          # started" row flips itself. Advisory — never fails the ops run.
          # Token-file restore enables the MCC-walk mode in CI too.
          if [ -n "$NARESTCO_ADS_TOKEN" ]; then
            printf '%s' "$NARESTCO_ADS_TOKEN" > clients/narestco/.ads-token.json
          fi
          python3 scripts/lsa_detect.py || true
          # Read the manager links BACK and write the result to
          # connection_metadata (2026-08-05). This is what feeds
          # client_concierge._stored_link_facts: the Railway ops-worker that
          # composes Monica's messages has NO Google Ads credentials, so the
          # live check there is always unavailable and the guard can only
          # retire an "accept our invite" ask from what this step wrote down.
          # Unrun for a week = Monica asking clients for access we already
          # hold (Jaziel/RestorationXpress, 2026-08-05 13:13).
          python3 scripts/lsa_link_audit.py --apply || true
          rm -f clients/narestco/.ads-token.json

      - name: Re-harvest new GBP photos (real-photo-first imagery, daily)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --gbp-only: the daily pass watches the one source that actually
          # changes day to day (the client uploading a job photo to their own
          # listing). The website re-crawl is weekly — a franchise page does not
          # gain new vans overnight. Both halves are incremental, so a day with
          # no new photos costs one storage list per client and no vision spend.
          python3 scripts/photo_harvest.py run --all --gbp-only || true

      - name: Backlink targets (seed new clients + live-link check)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/backlinks.py seed || true
          python3 scripts/backlinks.py check || true

      - name: Citations -> site schema sameAs reconciliation
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # sync-deploy pushes the per-client repo for sites live on main
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Declares each client's live directory listings (nap_audit source
          # of truth) as schema.org sameAs URLs in brand.ts. Citations trickle
          # in for weeks after launch — this keeps the JSON-LD in step.
          # Live-on-main sites commit + sync-deploy themselves; preview-only
          # edits ride the commit step below. Idempotent, quiet when in sync.
          python3 scripts/citations_sync.py || true

      - name: Cutover harvest (301 maps staged before any domain cutover)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME:  ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_AGENCY_TOKEN:     ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          # Clients whose real domain still serves their OLD site (probe:
          # /llms.txt vs the repo's own sites/{slug}/public/llms.txt) get the
          # old site's URL inventory harvested and a 301 map merged into
          # sites/{slug}/public/_redirects while the old site is still alive
          # — TRG/Crew had these hand-built; everyone else was going to lose
          # their old rankings/backlinks at cutover. Redirects on a preview
          # site are harmless and ride the next normal deploy (no sync-deploy
          # here). Freshness-gated (>30d) so the paid DataForSEO backlinks
          # call runs at most ~monthly per client; cap 3 clients/run.
          # --no-commit: files ride the commit step below (a mid-job commit
          # would be stranded unpushed when that step finds nothing new).
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
          fi
          python3 scripts/cutover_harvest.py check --all || true
          python3 scripts/cutover_harvest.py auto --limit 3 --no-commit || true
          rm -f .gsc-agency-token.json

      - name: Case-study intake (client-emailed job stories -> site pages)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:         ${{ secrets.GOOGLE_AI_API_KEY }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Clients email case-study write-ups to contact@restorationai.io
          # (Crew's ask, 2026-08-14). email_inbox_sync files them as
          # [CLIENT EMAIL] notes; this step classifies the unprocessed ones,
          # renders real submissions through the content engine's case-study
          # conventions (claims_lint errors BLOCK the page), publishes to the
          # branch each site lives on, work-logs every study, and files one
          # [FOR MONICA] note with the live links. Idempotent via ops_kv
          # processed-ids. Commits + sync-deploys its own pages. Advisory —
          # never fails the ops run.
          python3 scripts/case_study_intake.py ingest --all --apply || true

      - name: Refresh Search Console data (app Reports tab)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:          ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/gsc_sync.py --all || true
            rm -f .gsc-agency-token.json
          else
            echo "GSC_AGENCY_TOKEN secret not set — Reports tab keeps last-synced data."
          fi

      - name: Compile monthly summaries (app Monthly Summary tab)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_AGENCY_TOKEN_JSON:   ${{ secrets.GMAIL_AGENCY_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # Rolls every source of client-visible work (work log, GBP changes,
          # reviews, ads journals, citations, content, site git history) into
          # one monthly_summaries row per client, which the app renders as
          # Marketing -> Monthly Summary. Runs last so today's earlier steps
          # (citations sync, GBP harvest) are already in the ledger.
          # Stale-ask audit FIRST (Santino 2026-08-31: Michael/Rob/Josiah all
          # got asked for things we already held) — retire satisfied asks
          # before any downstream step or Monica slot can work them.
          python3 scripts/ask_staleness_audit.py || true
          # Favicons follow logos automatically (Air Care 2026-08-31)
          python3 scripts/favicon_sync.py || true
          # Gmail watcher (Fran Carlo case 2026-09-01): unanswered client
          # emails to contact@ become ops notes so Monica's loop sees them.
          # Skips cleanly until the GMAIL_AGENCY_TOKEN_JSON secret exists.
          if [ -n "$GMAIL_AGENCY_TOKEN_JSON" ]; then
            python3 scripts/gmail_watch.py || true
          else
            echo "(gmail-watch: no token secret yet — skipped)"
          fi
          python3 scripts/monthly_summary.py compile --all || true
          # Monthly Report card (marketing_work_reports): calendar-month
          # anchored since 2026-08-30 — refresh the running month daily so
          # the pinned card stays current, same cadence as the summary.
          python3 scripts/work_report.py --all --publish \
            --month "$(date -u +%Y-%m)" || true
          # First days of a month: also refinalize the month that just closed,
          # so late-arriving rows (e.g. last night's work) make the final cut.
          if [ "$(date -u +%-d)" -le 3 ]; then
            python3 scripts/monthly_summary.py compile --all \
              --month "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)" || true
            python3 scripts/work_report.py --all --publish \
              --month "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)" || true
          fi

      - name: Stripe payment-record reconciliation
        # Nightly self-heal: Stripe's paid invoices vs our billing_invoices.
        # The webhook race dropped records for 11 clients before 2026-09-03
        # (payment gate wrongly blocked their site builds); the first sweep
        # found 17 MORE missing invoices. Non-fatal: a Stripe hiccup must
        # not take down the ops pass.
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/stripe_reconcile.py || echo "stripe-reconcile failed (non-fatal)"

      - name: Commit refreshed client data
        run: |
          # sites/ too: the auto-build path (setup_ledger.ensure_auto_site_build)
          # scaffolds + renders sites/{slug} in this job — committing only
          # clients/ threw the rendered site away and CI re-rendered it daily
          # (Reign 2026-08-03, second-order cost: the whole render bill again).
          git add clients/ sites/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: client ops sync $(date +%Y-%m-%d) [automated]"
            git pull --rebase --autostash
            git push
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: Client Ops Sync run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Cron heartbeat (pg_cron pulse + latest-run status)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/cron_heartbeat.py || echo "heartbeat errored (non-fatal)"
