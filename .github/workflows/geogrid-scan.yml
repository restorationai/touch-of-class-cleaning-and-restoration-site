name: Geogrid Scan

# Cloud geo-grid scans — three triggers, one script:
#   1. workflow_dispatch with a slug — the app's "Refresh scan" button
#      (geogrid-refresh edge fn) and the signup flow.
#   2. workflow_dispatch without a slug — full fleet run on demand.
#   3. schedule (1st + 15th, 09:00 UTC) — the bi-weekly fleet scan. This
#      replaced the Railway geogrid-cron service 2026-09-02: Railway bakes
#      clients/ into the image at deploy time, so its Aug 15 run only saw the
#      5 clients that existed at its last deploy, and its Sept 1 run crashed
#      mid-narestco. Actions checks out fresh main every run, and the
#      same-day dedupe inside geogrid_cron makes reruns and scheduler
#      overlap spend-safe.

on:
  schedule:
    - cron: '0 9 1 * *'      # MONTHLY fleet scan (Santino 2026-09-06: biweekly
                             # at full-depth configs ≈ $400+/mo DFS; monthly +
                             # one on-demand rescan per client per month)
    - cron: '25 10 * * *'    # DAILY baseline catch-up (Santino 2026-09-09):
                             # ONLY clients with zero stored scans — a signup
                             # on the 9th sees heatmaps within 24h instead of
                             # waiting for the 1st. No-op on quiet days.
  workflow_dispatch:
    inputs:
      slug:
        description: "Client slug (empty = full fleet)"
        required: false

concurrency:
  # one lane PER SLUG (10-01): a shared group keeps only one pending run, so
  # each new dispatch cancelled the queued one (Dry1 Out + RestoPros first
  # scans were silently cancelled by the next client's bootstrap dispatch)
  group: geogrid-scan-${{ github.event.inputs.slug || 'fleet' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run geogrid scans
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$SLUG" ]; then
            python3 scripts/geogrid_cron.py --slug "$SLUG"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" != "01" ]; then
            python3 scripts/geogrid_cron.py --baseline-only
          else
            python3 scripts/geogrid_cron.py
          fi
      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] geogrid-scan failed: ${{ github.event.inputs.slug || 'FLEET' }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
