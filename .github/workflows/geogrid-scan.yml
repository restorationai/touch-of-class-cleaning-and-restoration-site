name: Geogrid Scan (on demand)

# Cloud geo-grid scan for one client — fired by the app's "Refresh scan"
# button (geogrid-refresh edge fn) and by the signup flow, so map data
# propagates natively without anyone's laptop (Santino 2026-09-02: "I don't
# want to have to come back here and ask for manual runs").

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Client slug (clients/{slug}/geogrid-*.json must exist)"
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run geogrid scans
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          python3 scripts/geogrid_cron.py --slug "${{ github.event.inputs.slug }}"
      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] geogrid-scan failed: ${{ github.event.inputs.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
