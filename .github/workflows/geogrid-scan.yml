name: Geogrid Scan

# Local map rankings (geo-grid), PER-CLIENT MATRIX (2026-10-01).
#
# Why it changed: the old single job scanned the whole fleet one grid after
# another (10-20 min per grid), so the 1st-of-month run needed many hours,
# hit its 330-minute timeout and was cancelled partway every month; and the
# daily cron ALSO ran a full fleet on the 1st (both cron lines matched the
# day-of-month check), so two fleet runs collided. House law (09-19): every
# system fans out per client.
#
#   plan   lists the clients with due work (geogrid_cron.py --list), cheapest
#          to finish first, under a per-pass budget (GEOGRID_DAILY_BUDGET,
#          default $40; the rest rolls to the next daily pass)
#   scan   one job per client: own timeout, own concurrency lane
#          (geogrid-client-<slug>), max 3 clients at once so the fleet stays
#          under DataForSEO's 2000 calls/min
#
# ONE schedule: daily 10:25 UTC. "Due" = configured (keyword x city x radius)
# with no scan this calendar month and none in the last 7 days, so the 1st
# runs the monthly pass and every later day only finishes what the month
# has not covered (a killed job resumes itself, at no extra cost).
#
# workflow_dispatch:
#   slug set   -> that client only, mode "ondemand" (app Refresh button,
#                 bootstrap): one full rescan per client per month
#   mode=due   -> scheduled semantics on demand (with or without slug)

on:
  schedule:
    - cron: '25 10 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: "Client slug (empty = every client with due work)"
        required: false
      mode:
        description: "due | ondemand (default: ondemand with a slug, else due)"
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - id: list
        name: List clients with due map scans
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEOGRID_DAILY_BUDGET:      ${{ vars.GEOGRID_DAILY_BUDGET }}
          SLUG: ${{ github.event.inputs.slug }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -z "$MODE" ]; then
            if [ -n "$SLUG" ]; then MODE=ondemand; else MODE=due; fi
          fi
          if [ -n "$SLUG" ]; then
            python3 -u scripts/geogrid_cron.py --list --mode "$MODE" --slug "$SLUG"
          else
            python3 -u scripts/geogrid_cron.py --list --mode "$MODE"
          fi

  scan:
    needs: plan
    if: needs.plan.outputs.slugs != '' && needs.plan.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    concurrency:
      # one lane per client across every run (scheduled, dispatched, app
      # refresh): two jobs never scan the same client at once
      group: geogrid-client-${{ matrix.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Scan ${{ matrix.slug }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 -u scripts/geogrid_cron.py --slug "${{ matrix.slug }}" --mode "${{ needs.plan.outputs.mode }}"
      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] geogrid-scan failed: ${{ matrix.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
