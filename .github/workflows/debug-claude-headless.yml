name: Debug claude headless
# Temporary diagnostic (2026-08-26): run-due burned its full 60-minute cap
# and produced ZERO content or log output on two consecutive runs, which
# looks like every `claude -p` call hanging from the first client. This
# answers, on the real runner: does the CLI work at all here, and is it
# plain -p, the MCP cold start, or the allowed-tools path that hangs?

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          # 2026-09-30: CI kept resolving Claude Code 2.1.197, which refuses
          # claude-opus-5-5 ("2.1.280 or newer is required"); dev agent and
          # the Mini-needs agent failed all afternoon. Fall back to the native
          # installer when the npm copy on PATH is still too old.
          V=$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "claude on PATH: ${V:-none}"
          if [ -z "$V" ] || [ "$(printf '%s\n' "2.1.280" "$V" | sort -V | head -1)" != "2.1.280" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            claude --version
          fi

      - name: CLI version
        run: claude --version

      - name: "Probe 1: bare claude -p"
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RC=0
          timeout 180 claude -p "Reply with exactly: OK" --output-format text || RC=$?
          echo "probe1 exit=$RC (124 = hung until timeout)"

      - name: "Probe 2: claude -p with DataForSEO MCP config (cold npx)"
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          MCP_TIMEOUT: "120000"
        run: |
          cat > /tmp/mcp.json <<EOF
          {"mcpServers":{"dataforseo":{"type":"stdio","command":"npx","args":["-y","dataforseo-mcp-server"],"env":{"DATAFORSEO_USERNAME":"$DATAFORSEO_USERNAME","DATAFORSEO_PASSWORD":"$DATAFORSEO_PASSWORD","ENABLED_MODULES":"SERP,KEYWORDS_DATA,ONPAGE,DATAFORSEO_LABS,BACKLINKS,DOMAIN_ANALYTICS,BUSINESS_DATA,CONTENT_ANALYSIS,AI_OPTIMIZATION"}}}}
          EOF
          RC=0
          timeout 300 claude -p "Use the dataforseo search-intent tool on the keyword 'water damage' and report the intent in one line. If the tool fails, say TOOL-FAILED and why." \
            --mcp-config /tmp/mcp.json \
            --allowed-tools "mcp__dataforseo__dataforseo_labs_search_intent" || RC=$?
          echo "probe2 exit=$RC (124 = hung until timeout)"

      - name: "Probe 3: claude -p writing a file (content-writer shape)"
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/probe3 && cd /tmp/probe3
          RC=0
          timeout 180 claude -p "Create a file named hello.md containing the single line 'hello'. Then stop." \
            --allowed-tools "Write,Edit,Read" || RC=$?
          echo "probe3 exit=$RC"
          ls -la /tmp/probe3; cat /tmp/probe3/hello.md 2>/dev/null || echo "hello.md NOT written"
