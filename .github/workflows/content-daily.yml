# Daily content lane (Santino 2026-09-05: "the system must run and must run
# punctually for every single client"). The weekly-maintenance run bundles
# content with audits/scans and its 60-minute step budget starved late-order
# clients (narestco went 9 days postless). This lane runs content ONLY
# (System 0 seeder + System 2 writer), staleness-first, every day, with a
# budget sized so every due client gets served. GitHub cron drops runs
# silently, so the Railway ops-worker also workflow_dispatches this daily
# (dedupe via the runs API, same pattern as client-concierge).
name: Content Daily

on:
  schedule:
    - cron: "23 10 * * *"   # 10:23 UTC daily (03:23 PT)
    # second daily slot (2026-09-19): one run writes ~10 posts (~25 min
    # each) while ~21 clients come due daily at 2/wk — staleness-first +
    # idempotent, the evening run continues where the morning stopped.
    - cron: "23 22 * * *"   # 22:23 UTC daily (15:23 PT)
  workflow_dispatch:
    inputs:
      only_slug:
        description: "Run content for ONE client slug (empty = all, staleness-first)"
        required: false
        default: ""

concurrency:
  group: content-daily
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Content Daily"
      - name: Run content systems (seeder + writer), staleness-first
        timeout-minutes: 280
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          DATAFORSEO_USERNAME:          ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:          ${{ secrets.DATAFORSEO_PASSWORD }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/target_terms_sync.py || true
          # C3 (2026-09-17): shallow queues — cap 6 queued/client, overflow
          # banked and auto-promoted as room frees. Strategy changes land in
          # days, never behind a 23-deep backlog.
          python3 scripts/content_queue_hygiene.py || true
          git add clients/*/content-queue.json 2>/dev/null || true
          git commit -m "content queue hygiene: cap/bank pass [automated]" || echo "hygiene: nothing to commit" 
          SLUG="${{ github.event.inputs.only_slug }}"
          if [ -n "$SLUG" ]; then
            python3 scripts/master_scheduler.py run-due --slug "$SLUG" --headless --systems 0,2
          else
            python3 scripts/master_scheduler.py run-due --all --headless --systems 0,2
          fi
      - name: Checkpoint push (never lose a written post)
        if: always()
        run: |
          # 2026-09-17 discovery: the writer's guarded per-post pushes skip
          # whenever ANY stray path dirties the runner's tree, and there was
          # no end-of-run push — so posts written after the first stray path
          # died with the runner. This step commits everything the run
          # produced and pushes it, always.
          git add -A
          git commit -m "content-daily: checkpoint (posts + queue updates) [automated]" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin main || echo "push failed — next run retries"

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] content-daily failed" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
