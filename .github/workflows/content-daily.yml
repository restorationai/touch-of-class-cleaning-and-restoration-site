# Daily content lane (Santino 2026-09-05: "the system must run and must run
# punctually for every single client"; 2026-09-19: "per-client basis, not
# bulk"). PER-CLIENT FAN-OUT: a cheap plan job lists every client due for
# System 0/2, then ONE isolated writer job runs per due client in parallel.
# Fleet growth adds parallel jobs, never queue depth — no shared wall clock
# for a late-alphabet or slow client to starve under (the narestco class).
# GitHub cron drops runs silently, so the Railway ops-worker also
# workflow_dispatches both slots (dedupe via the runs API).
name: Content Daily

on:
  schedule:
    - cron: "23 10 * * *"   # 10:23 UTC daily (03:23 PT)
    - cron: "23 22 * * *"   # 22:23 UTC daily (15:23 PT) — catch-up slot
  workflow_dispatch:
    inputs:
      only_slug:
        description: "Run content for ONE client slug (empty = all due)"
        required: false
        default: ""

concurrency:
  group: content-daily
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      slugs: ${{ steps.due.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Content Daily"
      - name: Queue hygiene + due list
        id: due
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          python3 scripts/target_terms_sync.py || true
          # C3: shallow queues — cap 6 queued/client, overflow banked and
          # auto-promoted as room frees.
          python3 scripts/content_queue_hygiene.py || true
          git add clients/*/content-queue.json 2>/dev/null || true
          git commit -m "content queue hygiene: cap/bank pass [automated]" || echo "hygiene: nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin main || echo "hygiene push failed — checkpoint retries"
          SLUG="${{ github.event.inputs.only_slug }}"
          if [ -n "$SLUG" ]; then
            echo "slugs=[\"$SLUG\"]" >> "$GITHUB_OUTPUT"
          else
            echo "slugs=$(python3 scripts/master_scheduler.py list-due --systems 0,2)" >> "$GITHUB_OUTPUT"
          fi

  write:
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Content Daily"
      - name: Write for ${{ matrix.slug }}
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          DATAFORSEO_USERNAME:          ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:          ${{ secrets.DATAFORSEO_PASSWORD }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/master_scheduler.py run-due --slug "${{ matrix.slug }}" --headless --systems 0,2
      - name: Checkpoint push (never lose a written post)
        if: always()
        run: |
          # Per-client scope: this job only commits its own client's paths,
          # and the rebase-retry loop absorbs races with sibling jobs.
          git add "clients/${{ matrix.slug }}" "sites/${{ matrix.slug }}" "clients/${{ matrix.slug }}.json" 2>/dev/null || true
          git commit -m "content-daily: ${{ matrix.slug }} checkpoint [automated]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push origin main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          echo "push failed after retries — next run retries"

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] content-daily failed for ${{ matrix.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
