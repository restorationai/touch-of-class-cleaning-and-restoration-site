name: Rank AI Weekly Maintenance

on:
  schedule:
    - cron: '0 16 * * 1'   # every Monday,   9 am PDT / 8 am PST
    - cron: '0 16 * * 4'   # every Thursday, 9 am PDT / 8 am PST
  workflow_dispatch:         # manual trigger for testing
    inputs:
      content_only:
        description: "Fast lane: run ONLY the content engine + commits (skip audits/scans/GBP). For draining the content backlog."
        type: boolean
        default: false
      only_slug:
        description: "Run content for ONE client slug (empty = all)"
        type: string
        default: ""

jobs:
  maintain:
    runs-on: ubuntu-latest
    # 150 not 120: the 08-26 run proved a single uncapped step (AIO scan hung
    # 14 min) can push a legitimately-full backlog run over 120 and the
    # runner teardown kills the final push mid-flight (commit 9411f1cb was
    # created and LOST). Every hang-capable step below now carries its own
    # cap, and content is checkpoint-pushed right after the content run.
    timeout-minutes: 195
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      - name: Harvest + triage the clients' OWN photos (real-photo-first imagery)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Superset of the old `gbp.py media-import --all`, which it still calls
          # internally — same GBP import into the app's Photos tab and the
          # GBP-post rotation, PLUS a re-crawl of each client's pre-existing /
          # franchise website and a vision triage of anything new. Clients add
          # photos to their GBP over time; those are free fresh assets, they are
          # the raw material for the case-study creator, and until this step
          # existed nothing ever looked at them.
          python3 scripts/photo_harvest.py run --all || echo "photo harvest failed (non-fatal — sites keep their current imagery)."

      - name: Sync GBP ratings + review snippets into brand.ts (before content run — freshened numbers ride each content deploy)
        timeout-minutes: 10
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/sync_brand_reviews.py --all || echo "Review sync failed (non-fatal — sites keep last-synced ratings)."
          # Commit now: the content step's sync-deploy pushes the subtree from
          # committed HEAD, so uncommitted brand.ts edits would not ride along.
          git add sites/*/src/lib/brand.ts sites/*/public/llms.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Review sync: no rating/review changes."
          else
            git commit -m "chore: sync GBP ratings + review snippets [automated]"
          fi

      - name: Run due systems (S1-S4 for all active clients)
        # 2026-08-21: this step hung and ate the ENTIRE 2h job budget on
        # every run since ~08-06 (runs died "cancelled 2h0m"), starving
        # every step below it — GBP daily insights went stale fleet-wide
        # and the Locations tab showed zeros (Roy/RX stuck at 08-03).
        # A hung content run may lose ITS slot, never the whole sweep.
        # content_only dispatches get the whole budget (100m under the 150m
        # job cap); normal runs keep 60m so the rest of the sweep still fits.
        timeout-minutes: ${{ inputs.content_only && 100 || 60 }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"   # step gets SIGKILLed at its cap — buffered stdout was dying with it, leaving blank logs
          # SUPABASE creds (2026-09-21, MCC leak): without them the
          # departed-status check FAILED OPEN and the scheduler wrote
          # content for a Suspended client. Same class as 09-18 ops-sync.
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN:   ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          DATAFORSEO_USERNAME:          ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:          ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          if [ -n "${{ inputs.only_slug }}" ]; then
            python3 scripts/master_scheduler.py run-due --slug "${{ inputs.only_slug }}" --headless
          else
            python3 scripts/master_scheduler.py run-due --all --headless
          fi

      - name: Checkpoint-commit content (survives any later hang or job-cap kill)
        # The expensive, client-visible output (blog posts, rendered pages) is
        # all written by the step above. Push it NOW — the 08-26 run wrote an
        # hour of backfill and lost it because the only commit lived at the
        # end of the job and the runner died mid-push.
        if: always()
        run: |
          git add clients/ sites/ portfolio/ docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to checkpoint."
          else
            # same hardening as the final commit step (3rd failure 09-24
            # was THIS step hitting the stamp-conflict rebase)
            git symbolic-ref -q HEAD >/dev/null || git checkout -B main
            git commit -m "chore: content checkpoint $(date +%Y-%m-%d) [automated]"
            # retry LOOP (09-25: single retry lost a race — another bot
            # pushed in the 1s window after a successful rebase)
            for attempt in 1 2 3 4; do
              git push origin HEAD:main && break
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                git checkout --theirs -- clients/ 2>/dev/null || true
                git add -A
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              [ "$attempt" = "4" ] && exit 1
              sleep $((attempt * 5))
            done
          fi

      - name: NAP consistency audit (monthly — first Monday; results feed the coverage gate)
        if: ${{ !inputs.content_only && (github.event.schedule == '0 16 * * 1' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 20
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          # Monthly gate: scheduled runs only fire in the first 7 days of the month
          # (= first Monday). Manual dispatch always runs. nap-audit.json lands in
          # clients/ and is committed by the "Commit generated state files" step,
          # which is why this lives here and not on the ephemeral Railway cron.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ]; then
            python3 scripts/nap_audit.py --all || echo "NAP audit errored (non-fatal — coverage gate will flag stale clients)."
          else
            echo "Not the first Monday of the month — skipping NAP audit."
          fi

      - name: Coverage gate (non-fatal — emails gap summary if any system is missing)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY:           ${{ secrets.SENDGRID_API_KEY }}
        run: |
          RC=0
          python3 scripts/master_scheduler.py coverage > coverage-report.txt 2>&1 || RC=$?
          cat coverage-report.txt
          if [ "$RC" -ne 0 ]; then
            python3 scripts/notify_failure.py \
              --subject "[Rank AI] Coverage gaps: ${{ github.workflow }} run #${{ github.run_number }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --body "$(cat coverage-report.txt)" || true
          fi

      - name: Claims lint (non-fatal — truth gate on shipped content claims)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          SENDGRID_API_KEY:           ${{ secrets.SENDGRID_API_KEY }}
        run: |
          # Truth gate born from the davis-construction incident: content
          # claiming 24/7 / certifications / license / response times the
          # client's brand truth data doesn't back. Non-fatal here (weekly run
          # must finish) but emails a violations report on any error hit.
          # Per-client JSON lands in clients/{slug}/claims-lint.json and is
          # committed by the "Commit generated state files" step below.
          RC=0
          python3 scripts/claims_lint.py --all --json > claims-lint-report.txt 2>&1 || RC=$?
          cat claims-lint-report.txt
          if [ "$RC" -ne 0 ]; then
            python3 scripts/notify_failure.py \
              --subject "[Rank AI] Claims lint violations: ${{ github.workflow }} run #${{ github.run_number }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --body "$(cat claims-lint-report.txt)" || true
          fi

      - name: GBP posts (2x/week — every Mon + Thu run)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 20
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          python3 scripts/gbp_post.py due --all
          # Refresh ledger states from Google so the app's Recent Google posts
          # feed shows LIVE/REJECTED truth, not create-time "processing"
          # (the July-August held-queue lesson, 2026-08-27).
          python3 scripts/gbp_post.py sync-states --all || echo "post-state sync failed (non-fatal)" 

      - name: Sync GBP profile snapshot + daily insights (2x/week — keeps dashboard data fresh)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 scripts/gbp.py sync --all || echo "GBP sync failed (non-fatal — dashboard uses last-synced data)."

      - name: Review responder (4-5 star auto-reply, 1-3 star parked for approval)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/review_responder.py --all || echo "review responder errored (non-fatal)"

      - name: Upload real job photos to GBP (2x/week — only if crews uploaded any)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/gbp_photos.py --all --limit 3

      - name: Service bank fan-out (A5 weekly, 2026-09-17)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/gbp_service_bank.py

      - name: Scan AI search visibility (sharded — every run completes)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 45
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        # B1 (2026-09-17): the unsharded fleet run timed out at 20 min EVERY
        # week since early August — late-roster clients never got scanned and
        # the app's visibility history froze. 19-client shards from a durable
        # cursor, Mon + Thu = the whole fleet every week, with per-client
        # history written as each client completes and a heartbeat the
        # pipeline watchdog monitors.
        run: python3 scripts/ai_search_scan.py --all --limit 8 --engines chatgpt,gemini,perplexity,claude --shard 19 --budget-min 38

      - name: Track Google AI Overviews (weekly — Monday + manual)
        if: ${{ !inputs.content_only && (github.event.schedule == '0 16 * * 1' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 25
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 scripts/google_aio_scan.py --all

      - name: Sync Google Search Console performance (before strategist)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:           ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/gsc_sync.py --all
          else
            echo "GSC_AGENCY_TOKEN secret not set — skipping GSC sync (strategist uses last-synced data)."
          fi

      - name: Indexing watchdog (weekly — Monday + manual; GSC index coverage + remediation)
        if: ${{ !inputs.content_only && (github.event.schedule == '0 16 * * 1' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 25
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:           ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          # Samples each live client's newest + money pages through the GSC
          # URL Inspection API (cap 50/client — 2.5% of the 2,000/day
          # per-property quota), stores the coverage trend in ops_kv, then
          # remediates: sitemap re-submit + IndexNow ping for not-indexed
          # URLs, one consolidated SUGGESTION card for pages Google refuses
          # to index on 2+ consecutive runs. Never uses the Indexing API
          # (job-postings-only — off-label use risks the property).
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/index_watchdog.py --all --apply || echo "index watchdog errored (non-fatal — next Monday's run rechecks)."
          else
            echo "GSC_AGENCY_TOKEN secret not set — skipping index watchdog."
          fi

      - name: Location Scout (weekly — where a second office would have to go)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 45
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_API_KEY:             ${{ secrets.CENSUS_API_KEY }}
        # Free to run: Nominatim, the Census ACS and the Supabase reads all
        # cost nothing, so the only budget is ~1-2 min per client of
        # rate-limit courtesy. Non-fatal — a bad plan-input on one client must
        # never take down the maintenance run.
        run: python3 scripts/location_scout.py --all || echo "location scout failed (non-fatal)"

      - name: Refresh strategist action plans (System 0)
        if: ${{ !inputs.content_only }}
        timeout-minutes: 20
        continue-on-error: true
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/strategist.py --all

      - name: Commit generated state files and content
        # ALWAYS commit what was produced — the 08-24 death discarded every
        # blog post written before the hang because this step never ran.
        if: always()
        run: |
          git add clients/ sites/ portfolio/ docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            # 2026-09-24 hardening: a dispatch re-run pushed from a DETACHED
            # checkout ("not currently on a branch"), and a busy human push
            # day left deploy-stamp conflicts in clients/*.json that the
            # bare `git pull --rebase` could not resolve. Branch-pin, then
            # rebase with a stamp-file auto-resolution (keep our replay;
            # stamps refresh on the next sync either way).
            git symbolic-ref -q HEAD >/dev/null || git checkout -B main
            git commit -m "chore: weekly maintenance run $(date +%Y-%m-%d) [automated]"
            for attempt in 1 2 3 4; do
              git push origin HEAD:main && break
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                git checkout --theirs -- clients/ 2>/dev/null || true
                git add -A
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              [ "$attempt" = "4" ] && exit 1
              sleep $((attempt * 5))
            done
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: ${{ github.workflow }} run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
