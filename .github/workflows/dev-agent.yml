name: Rank AI Dev Agent

# Nightly headless Claude Code run that executes approved [DEV] website tasks
# (Santino 2026-07-30, build #2 of the priority queue). Inbox = open
# marketing_ops_notes starting with [DEV] (Santino's "Site build" note tag,
# approved call proposals, and — since 2026-08-05 — client feedback routed
# straight off their own text messages by scripts/feedback_router.py).
# Guardrails live in scripts/dev_agent.md: deploy target follows the task's
# SITE: line, claims lint, max 5 tasks per CLIENT per run, punt-when-unsure.
# Every outcome files a [TODO-SANTINO] review row into the Today tab, and a
# client-originated task also files the [FROM SANTINO] note that has Monica
# tell the client it is done (scripts/dev_inbox.py close_the_loop).
on:
  schedule:
    - cron: '7 9 * * *'    # 2:07 AM PT nightly
    - cron: '7 20 * * 1-5' # 1:07 PM PT weekdays (Santino 2026-09-03: client-
                           # requested fixes from morning calls/messages land
                           # same-day instead of waiting for the overnight run)
  workflow_dispatch: {}

jobs:
  dev-agent:
    runs-on: ubuntu-latest
    # 80, not 55 (2026-08-05): an imagery correction is 3-4 generate+inspect
    # rounds per image, and a half-finished image task is worse than a punt.
    timeout-minutes: 170   # raised from 80 (Santino 2026-09-03: stress-test night — 4 clients' cards incl. image generation)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check the inbox (skip the run when empty)
        id: inbox
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          COUNT=$(python3 scripts/dev_inbox.py count)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Open [DEV] tasks: $COUNT"

      - name: Configure git identity
        if: steps.inbox.outputs.count != '0'
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Dev Agent"

      - name: Install Claude Code
        if: steps.inbox.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the dev agent
        if: steps.inbox.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT:                       ${{ secrets.GH_PAT }}
          # FULFILMENT KEYS (2026-08-05): the inbox now carries client
          # feedback, so the agent regenerates imagery and re-renders pages,
          # not just edits code. Without GOOGLE_AI_API_KEY every imagery task
          # punts; without the Cloudflare pair sync-deploy cannot ship.
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN:   ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          claude -p "$(cat scripts/dev_agent.md)" \
            --dangerously-skip-permissions \
            --output-format text \
            --max-turns 180

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: Dev Agent run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
