# Hourly: has Google accepted the GBP edits we are waiting on? (Santino
# 2026-09-30, DryCor name recase gating the LSA phone switch.) Files ONE
# [TODO-SANTINO] note per watch when it resolves; see scripts/gbp_edit_watch.py.
name: GBP Edit Watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: gbp-edit-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check open watches
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHL_API_KEY:                ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:            ${{ secrets.GHL_LOCATION_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/gbp_edit_watch.py check
      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] GBP edit watch failed" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
