name: Site Render

# Cloud renderer for pending site pages — the heavy half of the dev-agent
# scale-up (Santino 2026-09-03). Two triggers:
#   1. workflow_dispatch with a slug — the dev agent (or a human) hands off
#      a plan expansion via scripts/dispatch_render.py after scaffolding.
#   2. nightly sweep (3:07am PT, after the 2:07 agent run) — renders any
#      site with rendered:false pages under RENDER_SWEEP_CAP, so nothing
#      stays half-scaffolded for more than a day.
# render_sweep.py commits results and sync-deploys each site to the branch
# it already lives on (main if ever pushed to main, else staging).

on:
  schedule:
    - cron: '7 10 * * *'   # 3:07 AM PT nightly sweep
  workflow_dispatch:
    inputs:
      slug:
        description: "Site slug (empty = full sweep)"
        required: false

concurrency:
  group: site-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Render Sweep"
      - name: Render pending pages
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          RENDER_SWEEP_CAP:             "400"
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$SLUG" ]; then
            python3 scripts/render_sweep.py --slug "$SLUG"
          else
            python3 scripts/render_sweep.py
          fi
      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] site-render failed: ${{ github.event.inputs.slug || 'SWEEP' }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
