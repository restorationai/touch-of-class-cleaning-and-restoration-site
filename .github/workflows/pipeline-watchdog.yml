name: Pipeline Watchdog

# The watchdog ran only as a tail step of client-ops-sync, so when ops-sync
# itself died (every run cancelled 10-01, failed 09-30) the watchdog died
# with it and nothing alerted for days. Its own schedule now; the ops-sync
# tail call stays (alerts dedupe by key in ops_kv).

on:
  schedule:
    - cron: '30 15 * * *'   # 8:30 am PDT
    - cron: '30 3 * * *'    # 8:30 pm PDT
  workflow_dispatch:

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run the pipeline watchdog
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_PAT:                    ${{ secrets.GH_PAT }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/pipeline_watchdog.py
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] pipeline watchdog itself failed" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
