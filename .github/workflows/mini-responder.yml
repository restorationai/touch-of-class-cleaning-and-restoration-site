name: Mini responder

# Answers the Mac Mini's structured Needs (clients/_ops/mini-needs.md).
# EVENT-DRIVEN: fires within seconds of the Mini pushing a new need, so a
# parked task waits minutes, not hours. The schedule is only a backstop in
# case a push-triggered run was dropped. See scripts/mini_responder.py.
on:
  push:
    branches: [main]
    paths: ['clients/_ops/mini-needs.md']
  schedule:
    - cron: '7 15,19,23,3 * * *'   # 8am, 12pm, 4pm, 8pm PDT backstop
  workflow_dispatch: {}

concurrency:
  group: mini-responder
  cancel-in-progress: false

jobs:
  respond:
    # never re-fire on our own answer commit
    if: "!contains(github.event.head_commit.message, '[mini-responder]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fulfill needs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/mini_responder.py
      - name: Claude-first queue (needs routed to Claude, not yet answered)
        id: claudeq
        run: |
          N=$(python3 - <<'PY'
          import re
          t=open("clients/_ops/mini-needs.md").read().split("\n")
          n=0
          for i,l in enumerate(t):
              if l.startswith("- [~] NEED-") and "routed to Claude" in l:
                  nxt=t[i+1] if i+1 < len(t) else ""
                  if not re.match(r"\s+- (ANSWER|ASKED SANTINO)", nxt): n+=1
          print(n)
          PY
          )
          echo "count=$N" >> "$GITHUB_OUTPUT"; echo "needs for Claude: $N"
      - name: Install Claude Code
        if: steps.claudeq.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mini-needs agent (Claude answers; escalates to Santino only when it must)
        if: steps.claudeq.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          CONCIERGE_ALLOWLIST:       ${{ secrets.CONCIERGE_ALLOWLIST }}
          GH_PAT:                    ${{ secrets.GH_PAT }}
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          # 2026-09-30: CI kept resolving Claude Code 2.1.197, which refuses
          # claude-opus-5-5 ("2.1.280 or newer is required"); dev agent and
          # the Mini-needs agent failed all afternoon. Fall back to the native
          # installer when the npm copy on PATH is still too old.
          V=$(claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "claude on PATH: ${V:-none}"
          if [ -z "$V" ] || [ "$(printf '%s\n' "2.1.280" "$V" | sort -V | head -1)" != "2.1.280" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            claude --version
          fi
          git config user.name "Rank AI Bot"
          git config user.email "ops@restorationai.io"
          claude -p "$(cat scripts/mini_needs_agent.md)" \
            --model claude-opus-5-5 --dangerously-skip-permissions \
            --output-format text --max-turns 60
      - name: Commit answers + fire Mini trigger
        run: |
          git config user.name "Rank AI Bot"
          git config user.email "ops@restorationai.io"
          git add clients/_ops/mini-needs.md clients/_ops/mini-responder-log.md clients/_ops/mini-trigger clients/*/docs 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "mini needs answered [mini-responder] [automated]"
          for i in 1 2 3 4; do
            git pull -q --rebase --autostash origin main && git push -q origin main && exit 0
            sleep $((i*5))
          done
          exit 1
