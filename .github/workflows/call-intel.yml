name: Call Intel (transcribe + analyze tracked calls)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: call-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Transcribe + analyze new tracked calls
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_MASTER_ACCOUNT_SID: ${{ secrets.TWILIO_MASTER_ACCOUNT_SID }}
          TWILIO_MASTER_AUTH_TOKEN:  ${{ secrets.TWILIO_MASTER_AUTH_TOKEN }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/call_intel.py

      - name: Missed-opportunity / callback alerts (queue #6, 2026-09-14)
        # Freshly labeled calls -> SMS to the owner FROM THE CLIENT'S OWN
        # approved toll-free (their Twilio subaccount). Never our numbers;
        # clients without an approved line are skipped. 07:00-21:00 local,
        # overnight calls deliver next morning; deduped per call in ops_kv.
        run: python3 scripts/call_alerts.py --send || echo "call alerts failed (non-fatal)"
