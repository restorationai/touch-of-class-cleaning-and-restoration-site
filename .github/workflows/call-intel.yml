name: Call Intel (transcribe + analyze tracked calls)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: call-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests python-dotenv
      - name: Transcribe + analyze new tracked calls
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_MASTER_ACCOUNT_SID: ${{ secrets.TWILIO_MASTER_ACCOUNT_SID }}
          TWILIO_MASTER_AUTH_TOKEN:  ${{ secrets.TWILIO_MASTER_AUTH_TOKEN }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/call_intel.py

      - name: Missed-opportunity / callback alerts (queue #6, 2026-09-14)
        # Freshly labeled calls -> SMS to the owner FROM THE CLIENT'S OWN
        # approved toll-free (their Twilio subaccount). Never our numbers;
        # clients without an approved line are skipped. 07:00-21:00 local,
        # overnight calls deliver next morning; deduped per call in ops_kv.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_MASTER_ACCOUNT_SID: ${{ secrets.TWILIO_MASTER_ACCOUNT_SID }}
          TWILIO_MASTER_AUTH_TOKEN:  ${{ secrets.TWILIO_MASTER_AUTH_TOKEN }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          SENDGRID_API_KEY:         ${{ secrets.SENDGRID_API_KEY }}
          CONCIERGE_ALLOWLIST:       ${{ secrets.CONCIERGE_ALLOWLIST }}
        run: python3 scripts/call_alerts.py --send || echo "call alerts failed (non-fatal)"

      - name: Anthropic credit canary (outage tripwire, 2026-09-14)
        # 09-14 incident: credits ran dry and every AI surface (Monica,
        # debriefs, dev agent, email intake) died silently for hours. One
        # cheap probe; on the credit-balance 400 it texts Santino's ops
        # cell through GHL (no Anthropic needed), deduped 4h in ops_kv,
        # plus a one-time "restored" text when balance returns.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          CONCIERGE_ALLOWLIST:       ${{ secrets.CONCIERGE_ALLOWLIST }}
        run: python3 scripts/credit_canary.py || echo "canary failed (non-fatal)"

      - name: Rename + Location Scout autoseed (2026-09-15)
        # GBP connects -> research follows within ~30 min: house rename
        # candidates (state volumes, coverage-gated) + a first Location
        # Scout pass, so no client ever sees empty panels mid-onboarding
        # (Flood and Fire Solutions kickoff). Idempotent: any existing
        # name suggestions (open or dismissed) skip the client for good.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_USERNAME:       ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:       ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 scripts/rename_autoseed.py || echo "autoseed failed (non-fatal)"

      - name: Rename pipeline stage mirror (2026-09-15)
        # One derived stage per client for the Build Stages RENAME tab —
        # verifiable signals only (suggestions, convo kv, rename_intent,
        # BrightLocal citations). ~30 min freshness.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/rename_pipeline.py || echo "rename mirror failed (non-fatal)"

      - name: Rename approval evidence (2026-09-30)
        # Where did the client say yes to the chosen name? Filed DBA, Fathom
        # call, GHL phone call (transcribed once, cached) or message. Only
        # clients with a chosen name and no evidence; cheap once found.
        timeout-minutes: 15
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          FATHOM_API_KEY:            ${{ secrets.FATHOM_API_KEY }}
          FATHOM_SALES_API_KEYS:     ${{ secrets.FATHOM_SALES_API_KEYS }}
        run: python3 scripts/rename_evidence.py || echo "rename evidence failed (non-fatal)"
