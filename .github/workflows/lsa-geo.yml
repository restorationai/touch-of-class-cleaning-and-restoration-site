# LSA service-area coverage (Santino 2026-09-30, AirCare went live on Abilene
# only): every day, per client, compare the LSA campaign's location targets to
# every area the client told us they cover (onboarding wizard, GBP service
# area, site city pages, priority areas, site brief, HQ) and file ONE [FLAG]
# ops note when the uncovered set changes. PER-CLIENT FAN-OUT (LAW 09-19).
# Adding the areas is `python3 scripts/lsa_geo.py apply --slug X` (or run this
# workflow with apply=true for one slug).
name: LSA Service Areas

on:
  schedule:
    - cron: "47 13 * * *"   # 13:47 UTC daily, after the LSA lead review
  workflow_dispatch:
    inputs:
      only_slug:
        description: "Check ONE client slug (empty = all)"
        required: false
        default: ""
      apply:
        description: "Add the uncovered (non-broad) areas to LSA"
        required: false
        default: "false"

concurrency:
  group: lsa-geo
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slugs: ${{ steps.due.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clients with an LSA account
        id: due
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
        run: |
          SLUG="${{ github.event.inputs.only_slug }}"
          if [ -n "$SLUG" ]; then
            echo "slugs=[\"$SLUG\"]" >> "$GITHUB_OUTPUT"
          else
            echo "slugs=$(python3 scripts/lsa_geo.py list-due | tail -1)" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check ${{ matrix.slug }}
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_KEY:                ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:            ${{ secrets.GHL_LOCATION_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_MCC_CUSTOMER_ID: "2018844125"
          NARESTCO_ADS_TOKEN:         ${{ secrets.NARESTCO_ADS_TOKEN }}
        run: |
          # MCC access rides the narestco agency grant (same as lsa-lead-review)
          mkdir -p clients/narestco
          printf '%s' "$NARESTCO_ADS_TOKEN" > clients/narestco/.ads-token.json
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python3 scripts/lsa_geo.py apply --slug "${{ matrix.slug }}"
          else
            python3 scripts/lsa_geo.py check --slug "${{ matrix.slug }}"
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] LSA service-area check failed: ${{ matrix.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
