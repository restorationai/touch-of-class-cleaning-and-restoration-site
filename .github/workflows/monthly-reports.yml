name: Rank AI Monthly Reports

on:
  schedule:
    - cron: '0 17 1 * *'   # 1st of every month, 10 am PDT / 9 am PST (after weekly job completes)
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      # Client monthly reports are NOT generated here. client-reports.yml
      # (1st, 16:00 UTC) owns generate + publish + --notify (email + Monica
      # note) and delivered August on 09-01. This workflow's old report steps
      # called the pre-08-31 publish/send/portfolio subcommands (rc=2, the
      # 08-01 and 09-01 failures); the 09-17 "fix" swapped them for a second
      # `client_report.py --all --notify`, which would have emailed + texted
      # every client TWICE on 10-01 (one hour apart). Removed 09-29: one
      # canonical sender. This job keeps the monthly side-jobs only.

      - name: Wrong-page ranks check (queries stuck on home/blog + unserved-area demand)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:          ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          # token-on-disk contract shared with client-ops-sync's GSC steps
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/wrong_page_ranks.py --all --notes || echo "wrong-page-ranks errored (non-fatal)"
            rm -f .gsc-agency-token.json
          else
            echo "GSC_AGENCY_TOKEN secret missing — skipped"
          fi

      - name: Commit generated report files
        run: |
          git add clients/*/reports/ portfolio/digests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: $(date +%Y-%m) monthly reports generated [automated]"
            git push
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: ${{ github.workflow }} run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Tracking-number overage billing (2026-09-15)
        # 10 self-serve numbers included, $2/mo each after — wallet ledger
        # row + balance decrement, idempotent per company per month.
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/tracking_number_billing.py || echo "tn billing failed (non-fatal)"
