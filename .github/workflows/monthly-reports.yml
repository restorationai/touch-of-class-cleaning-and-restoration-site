name: Rank AI Monthly Reports

on:
  schedule:
    - cron: '0 17 1 * *'   # 1st of every month, 10 am PDT / 9 am PST (after weekly job completes)
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      - name: Restore Ads token file (narestco reports need Ads spend data)
        env:
          NARESTCO_ADS_TOKEN: ${{ secrets.NARESTCO_ADS_TOKEN }}
        run: |
          # 08-01 failure: narestco's publish exits 1 in CI with no Ads creds
          # (build_ads_client falls back to this per-client token file, which
          # is gitignored). Same restore pattern as GSC_AGENCY_TOKEN.
          if [ -n "$NARESTCO_ADS_TOKEN" ]; then
            printf '%s' "$NARESTCO_ADS_TOKEN" > clients/narestco/.ads-token.json
          fi

      - name: Generate + publish per-client reports (HTML file + Supabase for the app's Reports tab)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import json, pathlib, subprocess, sys
          from datetime import date, timedelta
          # Runs on the 1st — report on the month that just COMPLETED, not the
          # nine-hour-old current month (July 2026 published as '0 posts' bug).
          period = (date.today().replace(day=1) - timedelta(days=1)).strftime('%Y-%m')
          for p in sorted(pathlib.Path('clients').glob('*.json')):
              c = json.loads(p.read_text())
              if c.get('status') == 'active':
                  slug = c['slug']
                  rc = subprocess.call(['python3', 'scripts/client_report.py', 'publish', '--slug', slug, '--period', period])
                  if rc != 0:
                      print(f'WARNING: publish failed for {slug} (rc={rc})', file=sys.stderr)
          "

      - name: Send portfolio digest to operator
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python3 scripts/client_report.py portfolio --send

      - name: Wrong-page ranks check (queries stuck on home/blog + unserved-area demand)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_AGENCY_TOKEN:          ${{ secrets.GSC_AGENCY_TOKEN }}
        run: |
          # token-on-disk contract shared with client-ops-sync's GSC steps
          if [ -n "$GSC_AGENCY_TOKEN" ]; then
            printf '%s' "$GSC_AGENCY_TOKEN" > .gsc-agency-token.json
            python3 scripts/wrong_page_ranks.py --all --notes || echo "wrong-page-ranks errored (non-fatal)"
            rm -f .gsc-agency-token.json
          else
            echo "GSC_AGENCY_TOKEN secret missing — skipped"
          fi

      - name: Send per-client reports (only for clients with report_email_enabled=true)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 -c "
          import json, pathlib, subprocess, sys
          for p in sorted(pathlib.Path('clients').glob('*.json')):
              c = json.loads(p.read_text())
              if c.get('status') == 'active' and c.get('report_email_enabled'):
                  slug = c['slug']
                  rc = subprocess.call(['python3', 'scripts/client_report.py', 'send', '--slug', slug])
                  if rc != 0:
                      print(f'WARNING: send failed for {slug} (rc={rc})', file=sys.stderr)
          "

      - name: Commit generated report files
        run: |
          git add clients/*/reports/ portfolio/digests/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: $(date +%Y-%m) monthly reports generated [automated]"
            git push
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: ${{ github.workflow }} run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
