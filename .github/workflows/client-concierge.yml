name: Rank AI Client Concierge

# Monica, LIVE and headless (Santino 2026-07-30: "I would prefer her to not
# live only on this computer"). Twice daily:
#   16:07 UTC (~9am PT)  — main pass, mainland business hours
#   19:37 UTC (~12:30 PT) — catches Hawaii + anything the first run held
# Each run: 1) read the daily ledger state (client-ops-sync writes it before
# the first run), 2) poll + answer inbound replies, 3) compose + send nudges
# per client (all gates live in the code: allowlist, per-client cooldowns,
# business hours, meeting-imminent, LSA-intent, sentence-trim, re-intro
# guard). Escalations land in Ops Attention (concierge_escalations).
on:
  schedule:
    # EVERY DAY, not weekdays (Santino 2026-08-09). DISS Restoration's
    # preview ask cleared its 3-day soak on Friday 08-08; Saturday and
    # Sunday had no runs, so a finished site sat unsent all weekend and
    # the client would have waited until Monday. Restoration work does
    # not stop at the weekend and neither should the follow-up.
    - cron: '7 16 * * *'
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options:
          - daily
          - status
          - poll
        default: daily
      dry_run:
        description: 'Dry run (no sends)'
        type: boolean
        default: false

# One Monica at a time: 2026-08-11 the 16:07 slot ran three times (early
# Railway dispatch, on-time dispatch, then GitHub's cron arriving an hour
# late) and clients got the same ask worded three ways. The concurrency
# group stops overlap; the runlock step below stops the delayed-cron case
# where a second full pass starts after the first already finished.
concurrency:
  group: client-concierge
  cancel-in-progress: false

jobs:
  concierge:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      # Offline gates, ~2 seconds, no keys. The feedback router decides what
      # a client's own words are allowed to trigger unsupervised, so a
      # regression there is a regression in what ships to a live site
      # without a human. Fail the run before anything sends.
      - name: Offline regression gates
        run: |
          python3 scripts/client_concierge.py selfcheck
          python3 scripts/feedback_router.py selftest

      # A second pass inside the same slot (delayed cron, double dispatch)
      # exits here instead of re-texting every client. Dry runs skip the
      # lock (they send nothing and must stay inspectable on demand).
      - name: Acquire slot lock
        id: runlock
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "acquired=true" >> "$GITHUB_OUTPUT"   # dry runs never block
          elif python3 scripts/client_concierge.py runlock; then
            echo "acquired=true" >> "$GITHUB_OUTPUT"
          else
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            echo "Another Monica ran this slot — skipping sends."
          fi

      - name: Run concierge
        if: ${{ steps.runlock.outputs.acquired == 'true' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
          CONCIERGE_ALLOWLIST:       ${{ secrets.CONCIERGE_ALLOWLIST }}
          CONCIERGE_FROM_NUMBER:     ${{ secrets.CONCIERGE_FROM_NUMBER }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:   ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          SEND_FLAG="${{ github.event.inputs.dry_run == 'true' && '' || '--send' }}"
          if [ "$MODE" = "status" ]; then
            python3 scripts/client_concierge.py status
          elif [ "$MODE" = "poll" ]; then
            python3 scripts/client_concierge.py inbound --poll $SEND_FLAG
          else
            # Email intake FIRST (2026-08-21, the Sarha-promise gap: her
            # corrections email arrived at 13:00 and the daily ops-sync
            # would not have filed it until the NEXT morning, while Monica
            # had already promised "we'll get the changes made"). Running
            # it in both weekday slots means a client email becomes ops
            # notes within hours, ahead of the compose that follows.
            GMAIL_TOKEN_JSON='${{ secrets.GMAIL_TOKEN_JSON }}' \
            GMAIL_TOKEN_JSON_GETREST='${{ secrets.GMAIL_TOKEN_JSON_GETREST }}' \
            GOOGLE_OAUTH_CLIENT_ID='${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}' \
            GOOGLE_OAUTH_CLIENT_SECRET='${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}' \
              python3 scripts/email_inbox_sync.py || true
            # Daily routine: answer replies first, then outreach.
            python3 scripts/client_concierge.py inbound --poll $SEND_FLAG || true
            python3 scripts/client_concierge.py compose --all $SEND_FLAG
          fi

      - name: Morning digest to Santino (first run only; silent when quiet)
        if: ${{ steps.runlock.outputs.acquired == 'true' && (github.event.schedule == '7 16 * * *' || github.event.inputs.mode == 'daily') }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
        run: python3 scripts/concierge_digest.py || true

      - name: Commit state + escalations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git pull --rebase origin main || true
          git add clients/_ops/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: client concierge $(date +%Y-%m-%d) [automated]"
            git push
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: Client Concierge run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
