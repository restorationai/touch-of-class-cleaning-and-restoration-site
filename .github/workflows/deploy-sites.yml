name: Deploy Client Sites (cloud)

# Machine-independent site deploys (Santino 2026-08-24: "can we move this
# to railway so that I can hop off?"). Anything already COMMITTED to the
# monorepo can be sync-deployed from here — no laptop required. Trigger
# from the CLI:
#   gh workflow run deploy-sites.yml -R restorationai/Rank-AI-Pipeline \
#      -f slugs="narestco crew-restoration-construction" -f branch=main
#
# sync-deploy does a git subtree split, so the checkout needs full history.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'space-separated site slugs (sites/{slug})'
        required: true
      branch:
        description: 'target branch on the per-client repos'
        required: true
        default: 'main'
        type: choice
        options: [main, staging]

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for subtree split)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do NOT persist the github-actions[bot] credential — it gets
          # attached to EVERY github.com push and 403s on the per-client
          # repos. The PAT rewrite below owns auth instead.
          persist-credentials: false

      - name: Authenticate pushes to per-client repos with the PAT
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync-deploy each slug
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          git config user.name "rank-ai-bot"
          git config user.email "ops@restorationai.io"
          rc=0
          for slug in ${{ github.event.inputs.slugs }}; do
            echo "===== sync-deploy $slug -> ${{ github.event.inputs.branch }} ====="
            if python3 scripts/build_site.py sync-deploy \
                 --slug "$slug" --branch "${{ github.event.inputs.branch }}" --allow-dirty; then
              echo "OK: $slug"
            else
              echo "FAILED: $slug"; rc=1
            fi
          done
          exit $rc
