name: Rank AI Client Analyzer

# The biweekly results engine (Santino 2026-08-22: "make sure we are
# getting positive results, not just working software"). GitHub cron can't
# express every-2-weeks, so this runs WEEKLY and the --if-due flag skips
# any client analyzed within the last 12 days — net effect: each client
# gets a fresh plain-language analysis every two weeks, staggered.
# Publishes: internal report (repo + [ANALYZER] ops note) + the
# client-facing version into marketing_analyzer_reports (the app's
# Reports > Analysis tab).

on:
  schedule:
    - cron: '0 15 * * 0'   # Sundays 15:00 UTC (8am PT)
  workflow_dispatch:
    inputs:
      slug:
        description: 'single client slug (blank = fleet --if-due)'
        required: false

concurrency:
  group: client-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run analyzer
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            python3 scripts/client_analyzer.py --slug "${{ github.event.inputs.slug }}"
          else
            python3 scripts/client_analyzer.py --all --if-due
          fi

      - name: Commit reports
        run: |
          git config user.name "rank-ai-bot"
          git config user.email "ops@restorationai.io"
          python3 scripts/conflict_marker_guard.py || true   # never commit git conflict markers (09-30)
          git add clients/*/analyzer/ || true
          git diff --cached --quiet || git commit -m "analyzer: biweekly reports [automated]"
          git pull --rebase origin main || true
          git push origin main || true
