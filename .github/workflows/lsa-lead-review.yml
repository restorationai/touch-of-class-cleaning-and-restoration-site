# Daily AI review of every client's LSA leads (Santino 2026-09-27: "reading
# leads can help Google know what we do and don't want"). PER-CLIENT FAN-OUT
# (LAW 09-19): a plan job lists clients with an LSA account, then one isolated
# review job per client. SAFE MODE: GOOD leads + spam/solicitation/duplicate
# feedback go to Google automatically; job-type/geo judgments are held until
# the client's lead_profile is confirmed (scripts/lsa_lead_review.py approve).
name: LSA Lead Review

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC daily (06:17 PT), before owners start calling back
  workflow_dispatch:
    inputs:
      only_slug:
        description: "Review ONE client slug (empty = all)"
        required: false
        default: ""
      apply:
        description: "Send feedback to Google (false = dry run)"
        required: false
        default: "true"

concurrency:
  group: lsa-lead-review
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slugs: ${{ steps.due.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clients with an LSA account
        id: due
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHL_API_KEY:               ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
        run: |
          SLUG="${{ github.event.inputs.only_slug }}"
          if [ -n "$SLUG" ]; then
            echo "slugs=[\"$SLUG\"]" >> "$GITHUB_OUTPUT"
          else
            echo "slugs=$(python3 scripts/lsa_lead_review.py list-due | tail -1)" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - name: Review ${{ matrix.slug }}
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
          GHL_API_KEY:                ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID:            ${{ secrets.GHL_LOCATION_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_MCC_CUSTOMER_ID: "2018844125"
          NARESTCO_ADS_TOKEN:         ${{ secrets.NARESTCO_ADS_TOKEN }}
        run: |
          # MCC access rides the narestco agency grant (same as monthly-reports)
          mkdir -p clients/narestco
          printf '%s' "$NARESTCO_ADS_TOKEN" > clients/narestco/.ads-token.json
          APPLY=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.apply }}" = "true" ]; then APPLY="--apply"; fi
          python3 scripts/lsa_lead_review.py review --slug "${{ matrix.slug }}" --days 14 $APPLY

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] LSA lead review failed: ${{ matrix.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
