name: Rank AI Client Reports

# Fleet-wide monthly results packs (Santino 2026-08-30: "systematically for
# every client instead of just being on my machine when I ask"). One styled
# results page per active client: Google Search 28d comparison, review
# campaign progress, work delivered, live listings. Pages upload to the
# client-reports bucket and serve through the Railway API front door
# (/report/{company}/{file}); the URL lands in marketing_client_reports and
# the client's work ledger, so the app Reports feed carries the link and
# Monica can hand it to a client who asks how things are going.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Only this client (blank = whole fleet)"
        required: false
      period:
        description: "Period YYYY-MM (blank = current month)"
        required: false
  schedule:
    # 1st of the month, 16:00 UTC (8-9am PT) — the prior month's data is
    # complete and the report lands before anyone's workday.
    - cron: '0 16 1 * *'

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Write GSC agency credentials
        # client_report reads the agency GSC refresh token + oauth client the
        # same way gsc_setup does; secrets carry the two JSON files.
        env:
          GSC_AGENCY_TOKEN_JSON: ${{ secrets.GSC_AGENCY_TOKEN_JSON }}
          GSC_OAUTH_CLIENT_JSON: ${{ secrets.GSC_OAUTH_CLIENT_JSON }}
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          from gsc_setup import AGENCY_TOKEN_PATH, OAUTH_CLIENT_PATH
          for path, env in ((AGENCY_TOKEN_PATH, "GSC_AGENCY_TOKEN_JSON"),
                            (OAUTH_CLIENT_PATH, "GSC_OAUTH_CLIENT_JSON")):
              v = os.environ.get(env, "")
              if v.strip():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(v)
                  print(f"wrote {path}")
              else:
                  print(f"({env} empty — search sections will be skipped)")
          EOF

      - name: Generate fleet reports
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            python3 scripts/client_report.py --slug "${{ github.event.inputs.slug }}" ${{ github.event.inputs.period && format('--period {0}', github.event.inputs.period) || '' }}
          else
            python3 scripts/client_report.py --all --notify ${{ github.event.inputs.period && format('--period {0}', github.event.inputs.period) || '' }}
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: ${{ github.workflow }} run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
