name: Geogrid Month Watch

# One-month checkpoint on the first full map-rankings pass after the 10-01
# geogrid overhaul (Santino: "add a watcher to the map ranking for the next
# month"). Emails contact@ a per-client report on Nov 2, 4 and 8: scanned
# home combos, zero grids, broken images, visibility. The pipeline_watchdog
# geogrid card keeps covering the steady state after November.
#
# Expires on its own (cron is November only); delete this file once the
# November pass is confirmed clean.

on:
  schedule:
    - cron: '0 17 2,4,8 11 *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Report the month's map-rankings pass
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY:          ${{ secrets.SENDGRID_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -u scripts/geogrid_month_watch.py --email
