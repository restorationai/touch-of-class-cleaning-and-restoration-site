name: On-Demand System Run

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Client slug (e.g. narestco)"
        required: true
      system:
        description: "System number (1=keyword-research, 3=audit)"
        required: true
        type: choice
        options: ["1", "3"]
      job_id:
        description: "marketing_jobs UUID to update on completion"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run system ${{ inputs.system }} for ${{ inputs.slug }}
        id: run
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN:   ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          SENDGRID_API_KEY:             ${{ secrets.SENDGRID_API_KEY }}
          DATAFORSEO_USERNAME:          ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:          ${{ secrets.DATAFORSEO_PASSWORD }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/master_scheduler.py force-run \
            --slug ${{ inputs.slug }} \
            --system ${{ inputs.system }} \
            --headless
        continue-on-error: true

      - name: Notify API of completion
        env:
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          RAILWAY_API_URL: ${{ secrets.RAILWAY_API_URL }}
        run: |
          STATUS="completed"
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            STATUS="failed"
          fi
          curl -s -X POST "$RAILWAY_API_URL/jobs/${{ inputs.job_id }}/complete" \
            -H "Authorization: Bearer $API_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\"}"
