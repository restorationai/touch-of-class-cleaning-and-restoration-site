name: Rank AI GBP Maintenance

# GBP optimizer refresh + page-build queue drain.
#   1. gbp.py optimize --all   -> refresh marketing_gbp_suggestions for every client (safe; DB only)
#   2. gbp.py create-pages --all --build -> drain the page queue, build & deploy new pages
#
# Manual-first: run via "Run workflow" and confirm a queued page (e.g. Crawl Space
# Encapsulation) builds end-to-end BEFORE enabling the schedule below.

on:
  workflow_dispatch:
    inputs:
      build_pages:
        description: "Also build & deploy queued pages (create-pages --build)"
        type: boolean
        default: true
      face_audit:
        description: "Force the GBP front-face audit --apply (otherwise it only runs on the first Monday of the month)"
        type: boolean
        default: false
  # Verified end-to-end 2026-06-26 (Crawl Space Encapsulation built + deployed for Home Pride).
  # Runs Mondays 10am PT, after the weekly content run.
  schedule:
    - cron: '0 17 * * 1'

jobs:
  gbp:
    runs-on: ubuntu-latest
    # 300: the 2026-08-31 drain carries ~600+ city-x-service pages (6 new
    # fleet-wide services x ring cities); 60 min only fit the audit steps.
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"

      - name: Refresh GBP optimizer suggestions (all clients)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 scripts/gbp.py optimize --all

      - name: Auto-apply safe service suggestions (adds + negative-backed removals)
        # Executes the optimizer rows marked auto_safe (Santino 2026-08-26:
        # service adds/removals go full-auto; name/categories/address/pages
        # stay one-click in the app). Every applied change writes a
        # marketing_gbp_changes row (client Reports feed) and stamps its
        # suggestion 'applied' — the board is the review ledger.
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/gbp.py auto-apply --all

      - name: Add missing per-service descriptions (descriptions --all --apply)
        # Idempotent: only service items MISSING a description get one (existing
        # text is never overwritten), so the weekly pass converges to a no-op
        # per client and only picks up newly-added services. Claims-gated via
        # claims_lint truth tables; verified on narestco 2026-08-11 (20/20).
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/gbp.py descriptions --all --apply

      - name: Fill missing About-section profile fields (enrich --all --apply)
        # Add-only enrichment: opening date, social profile links, the on-site
        # service option, service areas, onboarding-selected services. An
        # existing value is NEVER overwritten, so the weekly pass converges to
        # a no-op per client and only picks up new gaps. Every applied change
        # lands in marketing_gbp_changes and feeds the monthly summary.
        # Verified fleet-wide 2026-08-11.
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/gbp.py enrich --all --apply

      - name: GBP-site parity check (gbp_site_parity --all --apply)
        # Santino's thesis: a GBP service backed by a matching site page ranks;
        # a bare label doesn't. Both directions per client: GBP services with no
        # page get classified (one sonnet call/client, DataForSEO metro volumes)
        # -- worth_a_page queues into marketing_page_requests (deduped, cap 10/
        # client/run, highest volume first; drained by the step below), junk
        # seeds ONE consolidated suggestion card (never auto-removed), phrasing
        # variants are report-only. One work_log line per client run.
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME:        ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 scripts/gbp_site_parity.py --all --apply

      - name: Execute approved service trims (gbp_service_trim --all --apply)
        # The executor for the parity checker's "dead weight services" cards:
        # whatever a human APPROVED in the app since the last run gets removed
        # from the live listing (exact-name match only, validateOnly preflight,
        # full-list PATCH minus the trims, re-read verify), one plain
        # marketing_gbp_changes row + work_log line per card, card flipped to
        # resolved. A name that can't be exact-matched refuses the whole card
        # and files a [TODO-SANTINO] ops note instead. Maiden voyage Air Care
        # 2026-08-17 (41 -> 40 items). No approved cards = clean no-op.
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: python3 scripts/gbp_service_trim.py --all --apply

      - name: Drain page-build queue and deploy (create-pages --build)
        if: ${{ github.event.inputs.build_pages != 'false' }}
        env:
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN:   ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: python3 scripts/gbp.py create-pages --all --build

      - name: GBP front-face conversion audit (monthly --apply; photos/description/services + action-plan flags)
        # Bounded: max 10 photo uploads per client per run, sha1 provenance in
        # clients/{slug}/gbp-face-state.json prevents re-uploads. Runs --apply on
        # the first Monday of each month (the weekly schedule fires Mondays), or
        # when forced via the face_audit dispatch input.
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN:    ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.face_audit }}" = "true" ] || [ "$(date -u +%d)" -le 7 ]; then
            python3 scripts/gbp_face_audit.py --apply --max-photos 10
          else
            echo "Not the first Monday of the month — running dry-run report only."
            python3 scripts/gbp_face_audit.py
          fi

      - name: Reconcile apex_live with reality (Fran/QCI incident backstop)
        env:
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/apex_live_sweep.py || true

      - name: Commit + push generated plan/content/catalog changes
        run: |
          python3 scripts/conflict_marker_guard.py || true   # never commit git conflict markers (09-30)
          git add clients/ sites/ templates/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: gbp page build $(date +%Y-%m-%d) [automated]"
          fi
          # Push whatever commits exist (create-pages --build commits per client before deploy).
          # 2026-09-29: a bare `git push || echo "nothing to push"` was REJECTED
          # every run (other lanes push during this 3.5h job) and the echo hid
          # it, so deployed pages never reached main and the next deploy rolled
          # them back. Rebase-retry, and fail loudly if it still can't land.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; true; }
            git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          echo "::error::gbp-maintenance could not push its commits to main (deployed pages will be rolled back by the next deploy)"
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] CI failure: ${{ github.workflow }} run #${{ github.run_number }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
