name: Mini responder canary

# End-to-end health check (Santino 2026-09-27: "make sure it's working as
# created"). Daily: plant a harmless company-nap need, let the real
# push-triggered responder answer it, and FAIL (GitHub emails the owner) if
# no answer lands within 6 minutes. Tests the whole path: push -> Actions
# trigger -> responder -> Supabase read -> commit back.
on:
  schedule:
    - cron: '41 16 * * *'   # 9:41am PDT
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Plant canary need
        id: plant
        run: |
          ID="NEED-CANARY-$(date -u +%Y%m%d%H%M)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "- [ ] $ID | type=company-nap | client=narestco | for=daily responder canary" >> clients/_ops/mini-needs.md
          git config user.name "Rank AI Bot"; git config user.email "ops@restorationai.io"
          git add clients/_ops/mini-needs.md
          git commit -q -m "responder canary $ID [automated]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
      - name: Wait for the responder to answer
        run: |
          for i in $(seq 1 36); do
            sleep 10
            git pull -q origin main
            if grep -q "\[x\] ${{ steps.plant.outputs.id }}" clients/_ops/mini-needs.md; then
              echo "CANARY OK — answered in ~$((i*10))s"; exit 0
            fi
          done
          echo "CANARY FAILED — responder did not answer ${{ steps.plant.outputs.id }} within 6 min"; exit 1
