name: Rank AI Video Automation

# Paced video generation, PER-CLIENT FAN-OUT (Santino 2026-09-19: "per-client
# basis for all of our systems"). A cheap plan job lists every connected
# client with video work due, then ONE isolated job renders + publishes that
# client's single video (blog->geo->geo cadence, at most one per run). Fleet
# growth adds parallel jobs, never queue depth — the 3-hour timeout saga
# (16/18/24-video bulk runs cancelled mid-render) is structurally dead: each
# job owns a 35-minute clock for its one ~7-25 min video.
# Cadence state: clients/{slug}/video-state.json, committed per client with
# rebase-retry. Upload privacy honours per-client video_publish_mode.
on:
  schedule:
    - cron: '0 16 * * 1,3,5'   # Mon/Wed/Fri, 9 am PDT / 8 am PST
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional: run for one client slug only'
        required: false
      dry_run:
        description: 'Dry run (plan only, render nothing)'
        type: boolean
        default: false

concurrency:
  group: video-automation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slugs: ${{ steps.due.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: List due clients
        id: due
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$SLUG" ]; then
            echo "slugs=[\"$SLUG\"]" >> "$GITHUB_OUTPUT"
          else
            echo "slugs=$(python3 scripts/video_cron.py --list-due)" >> "$GITHUB_OUTPUT"
          fi

  video:
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Configure git identity
        run: |
          git config user.email "ops@restorationai.io"
          git config user.name "Rank AI Bot"
      - name: Make video for ${{ matrix.slug }}
        timeout-minutes: 32
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:            ${{ secrets.GOOGLE_AI_API_KEY }}
          ELEVENLABS_API_KEY:           ${{ secrets.ELEVENLABS_API_KEY }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN:      ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN:   ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 -u scripts/video_cron.py --slug "${{ matrix.slug }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit state for ${{ matrix.slug }}
        if: always()
        run: |
          git add "clients/${{ matrix.slug }}" "sites/${{ matrix.slug }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: video ${{ matrix.slug }} $(date +%Y-%m-%d) [automated]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main || true
              git push && break
              sleep $((RANDOM % 15 + 5))
            done
          fi

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 scripts/notify_failure.py \
            --subject "[Rank AI] video automation failed for ${{ matrix.slug }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
