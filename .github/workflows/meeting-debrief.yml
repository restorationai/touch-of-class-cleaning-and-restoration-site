name: Meeting debrief watcher

# RETIRED from schedule 2026-09-03 (Santino): fathom_sync (Railway ops-worker,
# every 30 min) is the one post-meeting watcher — it caught all 6 calls on
# Sep 2 while this one's conservative matcher matched zero and filed nothing.
# Kept as manual dispatch only for one-off transcript-depth debriefs
# (--meeting-url); if fathom_sync ever under-captures, port this script's
# whole-transcript + mandatory-quote approach into it rather than rescheduling.
on:
  workflow_dispatch:

jobs:
  debrief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      - name: Debrief new client meetings into ops lanes
        env:
          FATHOM_API_KEY:            ${{ secrets.FATHOM_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/meeting_debrief.py
