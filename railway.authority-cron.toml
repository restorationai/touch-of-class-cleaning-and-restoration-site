# Railway config-as-code for the MONTHLY AI-visibility cron service ONLY.
# Set this service's "Config-as-code file path" to this file so it does NOT inherit
# the root railway.toml (FastAPI web) or the other service configs.
#
# MONTHLY refresh for every client in clients/company_map.json, upserting into
# marketing_action_plan (idempotent via action_key). Two steps:
#   1) authority_targets.py  -> Get-Listed targets (core directories + directories
#      AI cites for the client + national backlink link-gap; action_type='get_listed')
#   2) ai_keyword_planner.py -> demand-ranked AI-keyword opportunities via real AI
#      search volume + the sources AI pulls from (action_type='ai_keyword'/'get_listed')
# Existing/dismissed items are skipped, never duplicated.
[build]
builder = "NIXPACKS"

[deploy]
# --all = every client in company_map.json; --write = persist to the Action Plan.
# Run both steps; ';' so step 2 runs even if step 1 errors on a client.
startCommand = "bash -lc '/opt/venv/bin/python scripts/authority_targets.py --all --write; /opt/venv/bin/python scripts/ai_keyword_planner.py --all --write'"
# 09:00 UTC on the 1st of each month (~1h after the geo-grid cron, so AI/geo data
# is fresh). Backlinks + citations + AI demand move slowly — monthly is plenty.
cronSchedule = "0 9 1 * *"
# One-shot job: do NOT restart on exit, NO healthcheck.
restartPolicyType = "NEVER"

# Required service variables (set in the Railway dashboard for THIS service):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   — read AI-search data, write action plan
#   DATAFORSEO_USERNAME / DATAFORSEO_PASSWORD — backlinks domain_intersection (link-gap)
# Cost is tiny: ~$0.02-0.05 per client (one link-gap call); citation data is read
# from marketing_ai_search_scans we already collect.
