# Railway config-as-code for the ads_sync CRON service ONLY.
# The cron service's "Config-as-code file path" must be set to this file so it
# does NOT inherit the root railway.toml (which runs the FastAPI web server +
# a /health healthcheck). Build still uses nixpacks.toml (Python 3.11 + /opt/venv
# + pip install -r requirements.txt, which now includes google-ads).
[build]
builder = "NIXPACKS"

[deploy]
# Run the one-shot sync from the venv nixpacks builds.
startCommand = "/opt/venv/bin/python scripts/ads_sync.py"
# Daily at 09:00 UTC (~1-2am PT). 14-day trailing window makes the exact hour non-critical.
cronSchedule = "0 9 * * *"
# One-shot job: do NOT restart on exit, and NO healthcheck (it's not a server).
restartPolicyType = "NEVER"
