[phases.setup]
# git (queue #5, 2026-09-14): deploys clone the monorepo at runtime —
# sync-deploy subtree splits + stamp commits need a real git binary.
nixPkgs = ["python311", "python311Packages.pip", "git"]

[phases.install]
cmds = ["python3 -m venv /opt/venv", "/opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT"
