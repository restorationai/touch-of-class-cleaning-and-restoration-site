<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Restoration AI — Command Center</title>
<style>
  :root{
    --bg:#0b0f17; --card:#141a26; --card2:#1b2434; --line:#26324a;
    --txt:#e7ecf5; --mut:#8a97ad; --good:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#3dd0ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--mut);font-size:13px}
  select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
  .sectionlabel{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;margin:30px 0 12px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .label{color:var(--mut);font-size:12.5px;margin-bottom:8px;display:flex;justify-content:space-between}
  .card .val{font-size:30px;font-weight:700;letter-spacing:-.5px}
  .card .note{font-size:12px;color:var(--mut);margin-top:6px}
  .val.good{color:var(--good)} .val.warn{color:var(--warn)} .val.bad{color:var(--bad)}
  .delta{font-size:12.5px;font-weight:600;margin-top:5px}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--mut)}
  .hero{background:linear-gradient(160deg,#19222f,#141a26);border:1px solid var(--line)}
  .funnel{display:grid;gap:8px}
  .frow{display:grid;grid-template-columns:170px 1fr 130px;align-items:center;gap:12px}
  .frow .bar{height:30px;background:var(--card2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .frow .fill{height:100%;background:linear-gradient(90deg,#2b8fb3,#3dd0ff);display:flex;align-items:center;padding-left:10px;font-size:12px;color:#04121a;font-weight:700;white-space:nowrap}
  .frow .name{color:var(--mut);font-size:13px}
  .frow .meta{text-align:right;color:var(--mut);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.cur td{background:rgba(61,208,255,.06)}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(52,211,153,.15);color:var(--good)}
  .pill.err{background:rgba(248,113,113,.15);color:var(--bad)}
  .insight{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;padding:12px 16px;margin:8px 0;font-size:14px}
  .pb{background:linear-gradient(160deg,#1c2533,#141a26);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:16px 0 4px}
  .pb h2{margin:2px 0 4px;font-size:19px}
  .pb .prob{font-size:15.5px;margin:6px 0 4px;line-height:1.55}
  .pb .blk{margin-top:16px}
  .pb .blk .t{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-bottom:8px}
  .pb ol,.pb ul{margin:0;padding-left:20px}
  .pb li{margin:7px 0;line-height:1.5}
  .pb .do li::marker{color:var(--good);font-weight:700}
  .pb ul.dont{color:var(--mut)} .pb ul.dont li::marker{color:var(--bad)}
  .pb .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:rgba(248,113,113,.16);color:var(--bad);margin-bottom:10px;letter-spacing:.5px}
  .foot{color:var(--mut);font-size:12px;margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Restoration AI <span class="dot">●</span> Command Center</h1>
      <div class="sub" id="sub">loading…</div>
    </div>
    <select id="monthsel"></select>
  </header>

  <div id="playbook"></div>
  <div id="insights"></div>

  <div class="sectionlabel">The Scoreboard — what actually matters <span id="vslabel" style="text-transform:none;letter-spacing:0"></span></div>
  <div class="grid kpis" id="scoreboard"></div>

  <div class="sectionlabel">Spend → Lead → Demo → Close</div>
  <div class="card"><div class="funnel" id="funnel"></div></div>

  <div class="sectionlabel">Where the money goes (Meta campaigns)</div>
  <div class="card" style="padding:6px 4px;overflow-x:auto"><table id="camptable"></table></div>

  <div class="sectionlabel">Month over month</div>
  <div class="card" style="padding:6px 4px;overflow-x:auto"><table id="trendtable"></table></div>

  <div class="sectionlabel">Source health</div>
  <div class="card" id="sources" style="font-size:13px"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const money = n => n==null ? "—" : "$"+Number(n).toLocaleString();
const pct = n => n==null ? "—" : n+"%";
const CACHE = {};
async function getMonth(m){ if(!CACHE[m]) CACHE[m]=await fetch(`data/${m}.json`).then(r=>r.json()); return CACHE[m]; }

// delta vs previous month. higherBetter=true means an increase is good.
function delta(cur, prev, higherBetter, fmt){
  if(cur==null || prev==null) return "";
  const diff = cur - prev;
  if(Math.abs(diff) < 1e-9) return `<div class="delta flat">— no change vs prev</div>`;
  const good = higherBetter ? diff>0 : diff<0;
  const arrow = diff>0 ? "▲" : "▼";
  const val = fmt==="money" ? money(Math.abs(diff)) : (fmt==="pct" ? Math.abs(diff)+"pts" : Math.abs(diff));
  return `<div class="delta ${good?'up':'down'}">${arrow} ${val} vs prev</div>`;
}

// Plain-language diagnosis + action plan, chosen from the data.
function renderPlaybook(sb){
  const leads=sb.leads??0, demos=sb.demos_booked??0, closes=sb.clients_signed??0;
  const closePct=sb.demo_to_close_pct, l2d=sb.lead_to_demo_pct;
  let tag, prob, doList, dontList;
  if(leads>0 && leads<15 && (l2d==null || l2d<30)){
    tag="TOP-OF-FUNNEL PROBLEM";
    prob="<b>Not enough leads are coming in.</b> This one really is a traffic / creative problem — your ads aren't pulling enough people.";
    doList=["<b>Make 3–5 fresh creatives</b> testing different angles (speed, trust, ROI / more jobs).",
            "<b>Refresh the winning ad</b> before it fatigues and CPL climbs.",
            "<b>Shift budget</b> to whichever ad has the lowest cost-per-lead."];
    dontList=["Don't add funnel friction yet — get volume first."];
  } else if(demos>0 && (closePct==null || closePct<10)){
    tag="QUALITY & CLOSING PROBLEM";
    prob=`<b>You're booking demos with the wrong people — and not closing them.</b> ${demos} demos booked, ${closes} closed this month. Your ads are working fine (leads come in, ${l2d!=null?l2d+"% ":""}book a demo). The break is <b>after</b> the click. This is <u>not</u> a "make more ads" problem.`;
    doList=[
      "<b>Qualify before they book.</b> Add one question to the funnel — \"Are you a restoration company?\" — and stop non-restoration from booking. Right now you capture <b>zero</b> industry data on leads, so anyone gets in.",
      "<b>Narrow the targeting.</b> Turn <b>OFF</b> Advantage+ audience expansion and US-wide 18–65. Target restoration-specific audiences only, so Meta stops finding you dog groomers.",
      "<b>Fix the demo, not the ad.</b> Months of demos with almost no closes means the demo script / offer / follow-up needs work too — review what happens on the call."
    ];
    dontList=[
      "<b>Don't make more creatives or new angles.</b> Your ads already get clicks — more ads just buys more <i>wrong</i> leads, cheaper.",
      "<b>Don't refresh creatives to fix this.</b> That solves a problem you don't have right now."
    ];
  } else {
    tag="HEALTHY";
    prob="Funnel looks healthy this month. Keep doing what's working and keep an eye on the close rate.";
    doList=["Keep a steady creative-refresh cadence.","Put more budget behind the best-converting campaign."];
    dontList=["Don't change targeting while it's converting."];
  }
  document.querySelector("#playbook").innerHTML=`<div class="pb">
    <span class="tag">${tag}</span>
    <h2>What's going on &amp; what to do</h2>
    <div class="prob">${prob}</div>
    <div class="blk do"><div class="t">✅ Do this now — in order</div><ol>${doList.map(x=>`<li>${x}</li>`).join("")}</ol></div>
    <div class="blk"><div class="t">🚫 Don't waste time on</div><ul class="dont">${dontList.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  </div>`;
}

async function load(){
  const idx = await fetch("data/index.json").then(r=>r.json()).catch(()=>({months:[]}));
  const months = (idx.months||[]).sort().reverse(); // newest first
  const sel = $("#monthsel");
  sel.innerHTML = months.map(m=>`<option value="${m}">${m}</option>`).join("");
  sel.onchange = () => render(sel.value, months);
  if(months.length) render(months[0], months);
  else $("#sub").textContent = "No data yet — run aggregate.py";
}

async function render(month, months){
  const d = await getMonth(month);
  const sb = d.scoreboard, src = d.sources;
  const i = months.indexOf(month);
  const prevMonth = months[i+1];                 // older month
  const pd = prevMonth ? await getMonth(prevMonth) : null;
  const psb = pd ? pd.scoreboard : {};
  $("#sub").textContent = `${month} · updated ${new Date(d.generated_at).toLocaleString()}${d.backfilled?" · backfilled":""}`;
  $("#vslabel").innerHTML = prevMonth ? ` <span style="color:var(--mut)">— deltas vs ${prevMonth}</span>` : "";

  // insights
  const ins = [];
  if(sb.demos_booked>0 && sb.clients_signed===0)
    ins.push(`⚠️ <b>${sb.demos_booked} demos booked, 0 closed (0%).</b> The leak is demo→close — unqualified bookings. This is the #1 fix.`);
  const closes = months.map(m=>CACHE[m]?.scoreboard?.clients_signed).filter(x=>x!=null);
  if(sb.cost_per_demo && sb.cost_per_demo>150)
    ins.push(`💸 <b>${money(sb.cost_per_demo)} per demo</b> — and with a 0% close rate, effective cost per client is infinite.`);
  if(sb.lead_to_demo_pct && sb.lead_to_demo_pct>40)
    ins.push(`✅ Lead→demo is healthy (${pct(sb.lead_to_demo_pct)}). Top of funnel works; the problem is quality/closing downstream.`);
  $("#insights").innerHTML = ins.map(t=>`<div class="insight">${t}</div>`).join("");
  renderPlaybook(sb);

  // scoreboard cards: [label, value, colorClass, note, deltaHTML]
  const closeCls = sb.demo_to_close_pct===0 ? "bad" : (sb.demo_to_close_pct>=20?"good":"warn");
  const mrrDelta = d.backfilled ? `<div class="delta flat">point-in-time</div>` : delta(sb.mrr, psb.mrr, true, "money");
  const cards = [
    ["Demo → Close", pct(sb.demo_to_close_pct), closeCls, "the truth metric", delta(sb.demo_to_close_pct, psb.demo_to_close_pct, true, "pct")],
    ["Cost / Demo", money(sb.cost_per_demo), "warn", `${sb.demos_booked} booked`, delta(sb.cost_per_demo, psb.cost_per_demo, false, "money")],
    ["Cost / Client", sb.cost_per_client==null?"∞":money(sb.cost_per_client), sb.clients_signed?"":"bad", `${sb.clients_signed} signed`, ""],
    ["MRR", money(sb.mrr), "good", `${src.stripe?.active_subs??"?"} active subs`, mrrDelta],
    ["Ad Spend", money(sb.ad_spend), "", "this month", delta(sb.ad_spend, psb.ad_spend, false, "money")],
    ["Leads", sb.leads??"—", "", money(sb.cost_per_lead)+" / lead", delta(sb.leads, psb.leads, true, "n")],
    ["Demos Booked", sb.demos_booked??"—", "", "Restoration AI pipeline", delta(sb.demos_booked, psb.demos_booked, true, "n")],
    ["Lead → Demo", pct(sb.lead_to_demo_pct), "good", "top of funnel", delta(sb.lead_to_demo_pct, psb.lead_to_demo_pct, true, "pct")],
  ];
  $("#scoreboard").innerHTML = cards.map(([l,v,c,n,dl],idx)=>`
    <div class="card ${idx===0?'hero':''}">
      <div class="label"><span>${l}</span></div>
      <div class="val ${c||''}">${v}</div>
      <div class="note">${n||""}</div>
      ${dl||""}
    </div>`).join("");

  // funnel
  const steps = [["Ad Spend",sb.ad_spend,money(sb.ad_spend)],["Leads",sb.leads,sb.leads],
                 ["Demos Booked",sb.demos_booked,sb.demos_booked],["Clients Signed",sb.clients_signed,sb.clients_signed]];
  const max = Math.max(sb.leads||1, sb.demos_booked||0, sb.clients_signed||0, 1);
  $("#funnel").innerHTML = steps.map((s,idx)=>{
    const w = idx===0?100:Math.max(4,(s[1]/max)*100);
    const m = idx===2&&sb.lead_to_demo_pct!=null?pct(sb.lead_to_demo_pct)+" of leads":(idx===3?pct(sb.demo_to_close_pct)+" of demos":"");
    return `<div class="frow"><div class="name">${s[0]}</div>
      <div class="bar"><div class="fill" style="width:${w}%">${s[2]}</div></div>
      <div class="meta">${m}</div></div>`;
  }).join("");

  // campaigns
  const camps = (src.meta?.campaigns)||[];
  $("#camptable").innerHTML = `<tr><th>Campaign</th><th class="num">Spend</th><th class="num">CTR</th><th class="num">Clicks</th><th class="num">Leads</th></tr>`+
    camps.map(c=>`<tr><td>${c.name}</td><td class="num">${money(c.spend)}</td><td class="num">${c.ctr}%</td><td class="num">${c.clicks}</td><td class="num">${c.leads}</td></tr>`).join("");

  // month-over-month table (load all)
  await Promise.all(months.map(getMonth));
  const rows = months.map(m=>{ const s=CACHE[m].scoreboard; return `
    <tr class="${m===month?'cur':''}">
      <td>${m}${CACHE[m].backfilled?' <span style="color:var(--mut);font-size:11px">(bf)</span>':''}</td>
      <td class="num">${money(s.ad_spend)}</td>
      <td class="num">${s.leads??'—'}</td>
      <td class="num">${s.demos_booked??'—'}</td>
      <td class="num">${s.clients_signed??'—'}</td>
      <td class="num">${pct(s.demo_to_close_pct)}</td>
      <td class="num">${money(s.cost_per_demo)}</td>
    </tr>`; }).join("");
  $("#trendtable").innerHTML = `<tr><th>Month</th><th class="num">Spend</th><th class="num">Leads</th><th class="num">Demos</th><th class="num">Closes</th><th class="num">Close%</th><th class="num">Cost/Demo</th></tr>`+rows;

  // sources
  $("#sources").innerHTML = Object.entries(src).map(([k,v])=>{
    const err = v && v.error;
    return `<span style="display:inline-block;margin:4px 14px 4px 0">${k} <span class="pill ${err?'err':'ok'}">${err?'error':'ok'}</span></span>`;
  }).join("");

  $("#foot").innerHTML = `Snapshots stored: ${months.slice().reverse().join(", ")} · (bf)=backfilled, MRR is point-in-time for those · GHL demos = stage "Demo Meeting Booked"+ created that month`;
}
load();
</script>
</body>
</html>
