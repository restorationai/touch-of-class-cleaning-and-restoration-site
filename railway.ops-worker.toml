# Railway config-as-code for the always-on OPS WORKER service ONLY.
# Set this service's "Config-as-code file path" to this file so it does NOT
# inherit the root railway.toml (FastAPI web) or the other service configs.
#
# One long-lived scheduler (scripts/ops_scheduler.py) replaces the Mac
# launchd jobs: concierge inbound poll (5 min), setup@ email intake (5 min),
# Fathom meeting-intel sync (30 min), concierge nudges (hourly; per-client
# business-hours + cadence gates live in client_concierge.py). All state is
# in Supabase (ops_kv / concierge_escalations / Storage email-intake), so
# the container is disposable and redeploys are safe at any time.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "/opt/venv/bin/python scripts/ops_scheduler.py"
# Long-lived worker: restart if it ever dies. No healthcheck (not a web svc).
restartPolicyType = "ALWAYS"

# Required service variables (set in the Railway dashboard for THIS service):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   — state + intake writes
#   ANTHROPIC_API_KEY                         — compose/classify/match brains
#   GHL_API_KEY, GHL_LOCATION_ID              — GHL send/receive + calendar
#   CONCIERGE_ALLOWLIST                       — send gate (comma-separated)
#   CONCIERGE_FROM_NUMBER                     — toll-free sender +18556484464
#   FATHOM_API_KEY                            — meeting sync
#   GOOGLE_OAUTH_CLIENT_ID / _SECRET          — Gmail token refresh
#   GMAIL_TOKEN_JSON                          — contents of gmail_token.json
